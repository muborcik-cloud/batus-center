<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>City Level 3</title>
<style>
body { margin:0; overflow:hidden; background:#222; }
canvas { display:block; }

#ui {
  position:fixed;
  top:10px;
  left:10px;
  color:white;
  background:rgba(0,0,0,0.5);
  padding:10px;
  border-radius:10px;
}

#buttons {
  position:fixed;
  bottom:10px;
  right:10px;
}

button {
  margin:5px;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#444;
  color:white;
}

/* джойстик */
#joystick {
  position:fixed;
  bottom:40px;
  left:40px;
  width:100px;
  height:100px;
  background:rgba(255,255,255,0.1);
  border-radius:50%;
}
#stick {
  width:40px;
  height:40px;
  background:white;
  border-radius:50%;
  position:absolute;
  left:30px;
  top:30px;
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="ui">
💰 <span id="money">0</span><br>
🏠 <span id="houses">0</span>
</div>

<div id="buttons">
<button onclick="buyHouse()">Дом</button>
<button onclick="buyCar()">Машина</button>
<button onclick="buyTower()">Башня</button>
<button onclick="enterCar()">Сесть 🚗</button>
</div>

<div id="joystick"><div id="stick"></div></div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = innerWidth;
canvas.height = innerHeight;

let money = 0;
let houses = [];
let cars = [];
let towers = [];
let npcs = [];
let police = [];

let player = {x:300,y:300,speed:3,inCar:false};

// 💾 загрузка
if(localStorage.save){
  let s = JSON.parse(localStorage.save);
  money = s.money;
  houses = s.houses;
}

// 💰 доход
setInterval(()=>{
  money += 50;
  save();
},1000);

// 💾 сохранение
function save(){
  localStorage.save = JSON.stringify({
    money, houses
  });
}

// покупка
function buyHouse(){
  if(money>=50){
    money-=50;
    houses.push({x:rand(),y:rand()});
  }
}
function buyCar(){
  if(money>=100){
    money-=100;
    cars.push({x:rand(),y:rand()});
  }
}
function buyTower(){
  if(money>=200){
    money-=200;
    towers.push({x:rand(),y:rand()});
  }
}

// 🚗 сесть в машину
function enterCar(){
  cars.forEach(c=>{
    if(dist(player,c)<50){
      player.inCar = true;
    }
  });
}

function rand(){ return Math.random()*canvas.width; }
function dist(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }

// NPC
for(let i=0;i<15;i++){
  npcs.push({x:rand(),y:rand(),dx:1,dy:1});
}

// полиция
for(let i=0;i<3;i++){
  police.push({x:rand(),y:rand(),dx:2,dy:2});
}

// 🚦 светофор
let light = 0;
setInterval(()=>{
  light = (light+1)%2;
},2000);

// 📱 джойстик
let joy = {x:0,y:0};
let stick = document.getElementById("stick");

document.getElementById("joystick").addEventListener("touchmove",e=>{
  let t = e.touches[0];
  joy.x = (t.clientX-90)/50;
  joy.y = (t.clientY-90)/50;
  stick.style.left = (30+joy.x*20)+"px";
  stick.style.top = (30+joy.y*20)+"px";
});

document.getElementById("joystick").addEventListener("touchend",()=>{
  joy.x=0; joy.y=0;
  stick.style.left="30px";
  stick.style.top="30px";
});

function update(){
  let sp = player.inCar ? 6 : 3;

  player.x += joy.x*sp;
  player.y += joy.y*sp;

  npcs.forEach(n=>{
    n.x+=n.dx; n.y+=n.dy;
    if(n.x<0||n.x>canvas.width) n.dx*=-1;
    if(n.y<0||n.y>canvas.height) n.dy*=-1;
  });

  police.forEach(p=>{
    p.x+=p.dx; p.y+=p.dy;
  });
}

function draw(){
  ctx.fillStyle="#4caf50";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // дороги
  ctx.fillStyle="#777";
  for(let i=0;i<canvas.width;i+=150){
    ctx.fillRect(i,0,40,canvas.height);
  }
  for(let j=0;j<canvas.height;j+=150){
    ctx.fillRect(0,j,canvas.width,40);
  }

  // светофор
  ctx.fillStyle = light ? "red":"green";
  ctx.fillRect(50,50,20,40);

  houses.forEach(h=>{
    ctx.fillStyle="red";
    ctx.fillRect(h.x,h.y,30,30);
  });

  towers.forEach(t=>{
    ctx.fillStyle="black";
    ctx.fillRect(t.x,t.y,20,60);
  });

  cars.forEach(c=>{
    ctx.fillStyle="blue";
    ctx.fillRect(c.x,c.y,40,20);
  });

  police.forEach(p=>{
    ctx.fillStyle="white";
    ctx.fillRect(p.x,p.y,30,15);
  });

  npcs.forEach(n=>{
    ctx.fillStyle="yellow";
    ctx.beginPath();
    ctx.arc(n.x,n.y,5,0,6.28);
    ctx.fill();
  });

  ctx.fillStyle="orange";
  ctx.beginPath();
  ctx.arc(player.x,player.y,10,0,6.28);
  ctx.fill();

  document.getElementById("money").innerText = money;
  document.getElementById("houses").innerText = houses.length;
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
