<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Батутный центр в Душанбе | Trampoline Center</title>
<meta name="description" content="Лучший батутный центр в Душанбе. Детский развлекательный комплекс. Звоните и пишите в WhatsApp">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0b0b0b;
  color:#fff;
  scroll-behavior:smooth;
}
header{
  background:linear-gradient(135deg,#000,#1a1a1a);
  padding:60px 20px;
  text-align:center;
}
h1{color:#f5c26b;font-size:36px}
nav{
  position:sticky;
  top:0;
  background:#000;
  padding:15px;
  text-align:center;
  z-index:10;
}
nav a{
  color:#f5c26b;
  margin:0 12px;
  text-decoration:none;
  font-weight:bold;
}
.lang{
  position:fixed;
  top:15px;
  right:15px;
}
.lang button{
  background:#f5c26b;
  border:none;
  margin-left:5px;
  padding:6px 10px;
  cursor:pointer;
}
section{
  max-width:1100px;
  margin:auto;
  padding:60px 20px;
}
h2{color:#f5c26b;margin-bottom:20px}
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
}
.card{
  background:#161616;
  padding:25px;
  border-radius:15px;
  transition:transform .3s;
}
.card:hover{transform:translateY(-8px)}
.btn{
  display:inline-block;
  padding:14px 25px;
  margin:10px 5px;
  background:#25D366;
  color:#000;
  font-weight:bold;
  text-decoration:none;
  border-radius:12px;
}
.call{background:#f5c26b}
form input, form textarea{
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border:none;
  border-radius:8px;
}
form button{
  width:100%;
  padding:14px;
  background:#f5c26b;
  border:none;
  font-weight:bold;
  border-radius:10px;
}
iframe{
  width:100%;
  height:350px;
  border-radius:15px;
}
footer{
  background:#000;
  padding:25px;
  text-align:center;
  color:#777;
}
</style>

<script>
function setLang(l){
  document.querySelectorAll('[data-ru]').forEach(e=>{
    e.innerHTML=e.dataset[l];
  });
}
</script>
</head>

<body onload="setLang('ru')">

<div class="lang">
  <button onclick="setLang('ru')">RU</button>
  <button onclick="setLang('en')">EN</button>
</div>

<nav>
  <a href="#about" data-ru="О нас" data-en="About"></a>
  <a href="#prices" data-ru="Цены" data-en="Prices"></a>
  <a href="#contact" data-ru="Контакты" data-en="Contact"></a>
  <a href="#map" data-ru="Карта" data-en="Map"></a>
</nav>

<header>
  <h1 data-ru="Батутный центр в Душанбе"
      data-en="Trampoline Center in Dushanbe"></h1>
  <p data-ru="Лучшее место для детей и семей"
     data-en="Best place for kids and families"></p>
</header>

<section id="about">
<h2 data-ru="Кто мы" data-en="Who we are"></h2>
<p
data-ru="Мы современный батутный центр. Безопасно, весело и профессионально."
data-en="We are a modern trampoline center. Safe, fun and professional.">
</p>
</section>

<section id="prices">
<h2 data-ru="Цены" data-en="Prices"></h2>
<div class="cards">
  <div class="card">
    <h3>Basic</h3>
    <p data-ru="1 час" data-en="1 hour"></p>
    <strong>100 TJS</strong>
  </div>
  <div class="card">
    <h3>Standard</h3>
    <p data-ru="2 часа" data-en="2 hours"></p>
    <strong>200 TJS</strong>
  </div>
  <div class="card">
    <h3>Party</h3>
    <p data-ru="Праздник" data-en="Event"></p>
    <strong>400 TJS</strong>
  </div>
</div>
</section>

<section id="contact">
<h2 data-ru="Связаться" data-en="Contact"></h2>
<a class="btn" href="https://wa.me/992011900303">WhatsApp</a>
<a class="btn call" href="tel:+992011900303"
data-ru="Позвонить"
data-en="Call"></a>

<form>
<input placeholder="Имя / Name">
<input placeholder="Телефон / Phone">
<textarea placeholder="Сообщение / Message"></textarea>
<button
data-ru="Отправить заявку"
data-en="Send request"></button>
</form>
</section>

<section id="map">
<h2 data-ru="Где мы" data-en="Our location"></h2>
<iframe
src="https://maps.google.com/maps?q=Dushanbe&t=&z=13&ie=UTF8&iwloc=&output=embed">
</iframe>
<br><br>
<a class="btn call"
href="https://www.google.com/maps/dir/?api=1&destination=Dushanbe"
data-ru="Построить маршрут"
data-en="Build route"></a>
</section>

<footer>
© Batut Center | Душанбе
</footer>

</body>
</html>
