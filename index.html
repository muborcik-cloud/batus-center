<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>BATUS — Батутный центр Душанбе</title>

<!-- SEO -->
<meta name="description" content="BATUS — батутный центр в Душанбе. Безопасные батуты для детей и взрослых. Звонок, WhatsApp, онлайн-заявка.">
<meta name="keywords" content="батутный центр Душанбе, батуты Душанбе, детский центр Душанбе">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Inter',sans-serif;
  background:#050505;
  color:#fff;
  line-height:1.6;
}

/* LANGUAGE SWITCH */
.lang{
  position:fixed;
  top:20px;
  right:20px;
  display:flex;
  gap:10px;
  z-index:99;
}
.lang button{
  padding:8px 14px;
  border-radius:20px;
  border:none;
  font-weight:700;
  cursor:pointer;
  background:#222;
  color:#fff;
}
.lang button.active{background:#ffcc00;color:#000}

/* HERO */
.hero{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:40px 20px;
  background:
    linear-gradient(180deg,rgba(0,0,0,.6),rgba(0,0,0,.9)),
    url("https://images.unsplash.com/photo-1600508774634-4e11d34730e2?auto=format&fit=crop&w=1400&q=80")
    center/cover no-repeat;
}
.hero h1{
  font-size:clamp(28px,5vw,56px);
  font-weight:800;
}
.hero p{
  max-width:700px;
  margin:18px auto 34px;
  font-size:clamp(15px,2.2vw,19px);
  opacity:.9;
}

/* BUTTONS */
.btns{
  display:flex;
  gap:16px;
  justify-content:center;
  flex-wrap:wrap;
}
.btn{
  padding:14px 30px;
  border-radius:999px;
  font-weight:700;
  text-decoration:none;
  color:#000;
  background:linear-gradient(135deg,#ff0080,#ffcc00);
  box-shadow:0 15px 50px rgba(255,0,128,.4);
  transition:.3s;
}
.btn:hover{transform:translateY(-4px)}

/* SECTION */
section{
  max-width:1100px;
  margin:auto;
  padding:90px 20px;
}
h2{
  text-align:center;
  font-size:clamp(24px,4vw,40px);
  font-weight:800;
  margin-bottom:18px;
}
section p{
  max-width:780px;
  margin:0 auto 40px;
  text-align:center;
  opacity:.9;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:26px;
}
.card{
  background:#111;
  border-radius:22px;
  padding:28px;
  text-align:center;
  transition:.3s;
}
.card:hover{transform:translateY(-8px)}
.price{
  font-size:34px;
  font-weight:800;
  color:#ffcc00;
}

/* FORM */
form{
  max-width:520px;
  margin:auto;
  display:grid;
  gap:14px;
}
input,button{
  padding:14px;
  border-radius:12px;
  border:none;
  font-size:15px;
}
input{background:#1a1a1a;color:#fff}
button{
  background:linear-gradient(135deg,#00ffcc,#00ccff);
  font-weight:800;
  cursor:pointer;
}

/* MAP */
iframe{
  width:100%;
  height:420px;
  border-radius:22px;
  border:none;
}

/* FLOAT BUTTONS */
.float{
  position:fixed;
  right:20px;
  bottom:20px;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.float a{
  padding:14px 18px;
  border-radius:30px;
  background:#25D366;
  color:#000;
  font-weight:800;
  text-decoration:none;
  box-shadow:0 10px 40px rgba(0,0,0,.5);
}
</style>
</head>

<body>

<!-- LANGUAGE -->
<div class="lang">
  <button id="ru" class="active">RU</button>
  <button id="en">EN</button>
</div>

<!-- HERO -->
<div class="hero">
  <div>
    <h1 data-ru="Батутный центр BATUS в Душанбе"
        data-en="BATUS Trampoline Center in Dushanbe"></h1>

    <p data-ru="Безопасные батуты, радость, эмоции и праздник для детей и взрослых."
       data-en="Safe trampolines, joy and unforgettable emotions for kids and adults."></p>

    <div class="btns">
      <a class="btn" href="tel:+992011900303"
         data-ru="Позвонить"
         data-en="Call"></a>
      <a class="btn" href="https://wa.me/992011900303"
         data-ru="WhatsApp"
         data-en="WhatsApp"></a>
    </div>
  </div>
</div>

<!-- ABOUT -->
<section>
  <h2 data-ru="Кто мы" data-en="Who we are"></h2>
  <p data-ru="Мы — современный батутный центр в Душанбе. Безопасность, чистота и счастье детей — наш приоритет."
     data-en="We are a modern trampoline center in Dushanbe. Safety, cleanliness and children’s happiness are our priority."></p>
</section>

<!-- PRICES -->
<section>
  <h2 data-ru="Цены" data-en="Prices"></h2>
  <div class="grid">
    <div class="card"><h3>Basic</h3><div class="price">100 c.</div></div>
    <div class="card"><h3>Standard</h3><div class="price">200 c.</div></div>
    <div class="card"><h3>Premium</h3><div class="price">400 c.</div></div>
  </div>
</section>

<!-- FORM -->
<section>
  <h2 data-ru="Оставить заявку" data-en="Send request"></h2>
  <form>
    <input placeholder="Имя / Name">
    <input placeholder="Телефон / Phone">
    <button data-ru="Отправить" data-en="Send"></button>
  </form>
</section>

<!-- MAP -->
<section>
  <h2 data-ru="Как нас найти" data-en="How to find us"></h2>
  <iframe src="https://maps.google.com/maps?q=Душанбе&t=&z=13&ie=UTF8&iwloc=&output=embed"></iframe>
</section>

<!-- FLOAT -->
<div class="float">
  <a href="tel:+992011900303">📞</a>
  <a href="https://wa.me/992011900303">💬</a>
</div>

<script>
const ruBtn=document.getElementById('ru');
const enBtn=document.getElementById('en');
const elements=document.querySelectorAll('[data-ru]');

function setLang(lang){
  elements.forEach(el=>{
    el.textContent=el.dataset[lang];
  });
  ruBtn.classList.toggle('active',lang==='ru');
  enBtn.classList.toggle('active',lang==='en');
}

ruBtn.onclick=()=>setLang('ru');
enBtn.onclick=()=>setLang('en');
setLang('ru');
</script>

</body>
</html>
