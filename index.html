<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Батутный центр | Trampoline Center</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0c0c0c;
  color:#fff;
}
header{
  background:#000;
  padding:30px;
  text-align:center;
}
h1{color:#f5c26b}
.lang{
  position:absolute;
  top:15px;
  right:15px;
}
.lang button{
  background:#f5c26b;
  border:none;
  padding:6px 10px;
  margin-left:5px;
  cursor:pointer;
  font-weight:bold;
}
section{
  max-width:1000px;
  margin:auto;
  padding:40px 20px;
}
h2{color:#f5c26b}
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
}
.card{
  background:#161616;
  padding:20px;
  border-radius:12px;
}
a.btn{
  display:block;
  margin-top:15px;
  padding:12px;
  text-align:center;
  background:#25D366;
  color:#000;
  text-decoration:none;
  font-weight:bold;
  border-radius:10px;
}
.call{background:#f5c26b}
footer{
  text-align:center;
  padding:20px;
  background:#000;
  color:#777;
}
</style>

<script>
function setLang(lang){
  document.querySelectorAll('[data-ru]').forEach(el=>{
    el.innerHTML = el.dataset[lang];
  });
}
</script>
</head>

<body onload="setLang('ru')">

<div class="lang">
  <button onclick="setLang('ru')">RU</button>
  <button onclick="setLang('en')">EN</button>
</div>

<header>
  <h1 data-ru="Батутный центр в Душанбе"
      data-en="Trampoline Center in Dushanbe"></h1>

  <p data-ru="Современный детский развлекательный центр"
     data-en="Modern children entertainment center"></p>
</header>

<section>
  <h2 data-ru="О нас" data-en="About us"></h2>
  <p
    data-ru="Мы — профессиональный батутный центр в городе Душанбе. Трёхэтажный комплекс для детей и семей."
    data-en="We are a professional trampoline center in Dushanbe. A three-floor entertainment complex for kids and families.">
  </p>
</section>

<section>
  <h2 data-ru="Цены" data-en="Prices"></h2>
  <div class="cards">
    <div class="card">
      <h3 data-ru="Базовый" data-en="Basic"></h3>
      <p data-ru="1 час прыжков" data-en="1 hour jumping"></p>
      <strong>100 TJS</strong>
    </div>
    <div class="card">
      <h3 data-ru="Стандарт" data-en="Standard"></h3>
      <p data-ru="2 часа + игры" data-en="2 hours + games"></p>
      <strong>200 TJS</strong>
    </div>
    <div class="card">
      <h3 data-ru="Праздник" data-en="Party"></h3>
      <p data-ru="День рождения" data-en="Birthday event"></p>
      <strong>400 TJS</strong>
    </div>
  </div>
</section>

<section>
  <h2 data-ru="Связаться с нами" data-en="Contact us"></h2>

  <a class="btn" href="https://wa.me/992011900303"
     data-ru="Написать в WhatsApp"
     data-en="Write on WhatsApp"></a>

  <a class="btn call" href="tel:+992011900303"
     data-ru="Позвонить"
     data-en="Call us"></a>
</section>

<footer>
  © Batut Center | Душанбе
</footer>

</body>
</html>
