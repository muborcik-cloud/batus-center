<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Моя игра</title>
<style>
body { margin:0; overflow:hidden; background:#6ccf5f; }
#ui {
  position:fixed; top:10px; left:10px;
  background:#0008; color:#fff;
  padding:10px; border-radius:10px;
}
button {
  margin:5px;
}
</style>
</head>
<body>

<div id="ui">
💰 Деньги: <span id="money">0</span><br>
🏠 Дома: <span id="houses">0</span><br>
<button onclick="buyHouse()">Купить дом (50)</button>
<button onclick="buyCar()">Машина (60)</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let money = 0;
let houses = 0;
let cars = [];

let player = {x:200, y:200};

function updateUI(){
  document.getElementById("money").innerText = money;
  document.getElementById("houses").innerText = houses;
}

// деньги каждые 2 секунды
setInterval(()=>{
  money += 10;
  updateUI();
},2000);

function buyHouse(){
  if(money >= 50){
    money -= 50;
    houses++;
    updateUI();
  }
}

function buyCar(){
  if(money >= 60){
    money -= 60;
    cars.push({x:Math.random()*canvas.width, y:Math.random()*canvas.height});
    updateUI();
  }
}

// управление
document.addEventListener("keydown", e=>{
  if(e.key==="w") player.y-=10;
  if(e.key==="s") player.y+=10;
  if(e.key==="a") player.x-=10;
  if(e.key==="d") player.x+=10;
});

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // игрок
  ctx.fillStyle="blue";
  ctx.fillRect(player.x, player.y, 20, 20);

  // дома
  for(let i=0;i<houses;i++){
    ctx.fillStyle="red";
    ctx.fillRect(100+i*30,100,20,20);
  }

  // машины
  ctx.fillStyle="black";
  cars.forEach(c=>{
    ctx.fillRect(c.x, c.y, 25, 15);
  });

  requestAnimationFrame(draw);
}

draw();
updateUI();
</script>

</body>
</html>
