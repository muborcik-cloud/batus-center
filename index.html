<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Game</title>
<style>
body { margin:0; overflow:hidden; font-family:Arial; }

#ui{
 position:absolute;
 top:0;
 width:100%;
 background:#111;
 color:white;
 padding:10px;
}

#joy{
 position:absolute;
 bottom:20px;
 left:20px;
 width:100px;
 height:100px;
 background:rgba(255,255,255,0.3);
 border-radius:50%;
}

#stick{
 width:40px;
 height:40px;
 background:white;
 border-radius:50%;
 position:absolute;
 left:30px;
 top:30px;
}

button{
 position:absolute;
 right:20px;
 padding:12px;
 font-size:16px;
}

#build{ bottom:120px; }
#upgrade{ bottom:70px; }
</style>
</head>

<body>

<div id="ui">
💰 <span id="money">200</span> |
🏠 <span id="houses">0</span>
</div>

<div id="joy"><div id="stick"></div></div>

<button id="build">🏠</button>
<button id="upgrade">⬆️</button>

<canvas id="game"></canvas>

<script>
const c = document.getElementById("game");
const ctx = c.getContext("2d");

c.width = window.innerWidth;
c.height = window.innerHeight;

let player = {x:300,y:300};
let money = 200;
let houses = [];
let joy = {x:0,y:0};

// джойстик
const stick = document.getElementById("stick");

document.getElementById("joy").addEventListener("touchmove", e=>{
 let t=e.touches[0];
 let rect=e.target.getBoundingClientRect();

 let dx=t.clientX-(rect.left+50);
 let dy=t.clientY-(rect.top+50);

 joy.x=dx/50;
 joy.y=dy/50;

 stick.style.left=(30+dx/2)+"px";
 stick.style.top=(30+dy/2)+"px";
});

document.addEventListener("touchend", ()=>{
 joy.x=0; joy.y=0;
 stick.style.left="30px";
 stick.style.top="30px";
});

// кнопки
build.onclick=()=>{
 if(money>=50){
  houses.push({x:player.x,y:player.y,level:1});
  money-=50;
 }
};

upgrade.onclick=()=>{
 let near=null,dist=50;

 houses.forEach(h=>{
  let d=Math.hypot(player.x-h.x,player.y-h.y);
  if(d<dist){near=h;dist=d;}
 });

 if(near){
  let cost=near.level*40;
  if(money>=cost){
   money-=cost;
   near.level++;
  }
 }
};

// движение
function move(){
 player.x+=joy.x*3;
 player.y+=joy.y*3;
}

// доход
setInterval(()=>{
 houses.forEach(h=>money+=h.level);
 update();
},1000);

// рисуем
function draw(){
 ctx.clearRect(0,0,c.width,c.height);

 // фон
 ctx.fillStyle="#6fdc3c";
 ctx.fillRect(0,0,c.width,c.height);

 // дома
 houses.forEach(h=>{
  ctx.fillStyle="brown";
  ctx.fillRect(h.x-15,h.y-15,30,30);
 });

 // игрок
 ctx.fillStyle="blue";
 ctx.fillRect(player.x-10,player.y-10,20,20);
}

// UI
function update(){
 document.getElementById("money").innerText=Math.floor(money);
 document.getElementById("houses").innerText=houses.length;
}

// цикл
function loop(){
 move();
 draw();
 requestAnimationFrame(loop);
}

update();
loop();
</script>

</body>
</html>
