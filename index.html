<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Моя игра</title>
<style>
body { margin:0; overflow:hidden; font-family:sans-serif; }
#ui {
  position:absolute; top:10px; left:10px;
  background:rgba(0,0,0,0.5); color:white; padding:10px;
}
#buttons {
  position:absolute; right:10px; bottom:10px;
}
button { margin:5px; padding:10px; }
#joystick {
  position:absolute; left:20px; bottom:20px;
  width:80px; height:80px;
  background:rgba(255,255,255,0.3);
  border-radius:50%;
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="ui">💰 Деньги: <span id="money">0</span></div>

<div id="buttons">
  <button onclick="buildHouse()">🏠 Дом</button>
  <button onclick="spawnCar()">🚗 Машина</button>
</div>

<div id="joystick"></div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

let player = { x: 300, y: 300 };
let houses = [];
let cars = [];
let money = 0;

// деньги каждые 2 сек
setInterval(() => {
  money += 5;
  document.getElementById("money").innerText = money;
}, 2000);

// управление
let keys = {};
document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

// строительство
function buildHouse() {
  if (money >= 20) {
    houses.push({ x: player.x, y: player.y });
    money -= 20;
  }
}

// машина
function spawnCar() {
  if (money >= 30) {
    cars.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height });
    money -= 30;
  }
}

// рисуем игрока (с головой и телом)
function drawPlayer() {
  ctx.fillStyle = "blue";
  ctx.fillRect(player.x, player.y, 20, 30); // тело

  ctx.fillStyle = "#f5c6a5";
  ctx.beginPath();
  ctx.arc(player.x+10, player.y-10, 10, 0, Math.PI*2);
  ctx.fill(); // голова
}

// игра
function update() {
  if (keys["w"]) player.y -= 3;
  if (keys["s"]) player.y += 3;
  if (keys["a"]) player.x -= 3;
  if (keys["d"]) player.x += 3;
}

// город (дороги)
function drawCity() {
  ctx.fillStyle = "#6c6c6c";
  for (let i=0;i<canvas.width;i+=120){
    ctx.fillRect(i,0,40,canvas.height);
  }
  for (let j=0;j<canvas.height;j+=120){
    ctx.fillRect(0,j,canvas.width,40);
  }
}

// дома
function drawHouses() {
  houses.forEach(h => {
    ctx.fillStyle = "red";
    ctx.fillRect(h.x, h.y, 30, 30);
  });
}

// машины
function drawCars() {
  cars.forEach(c => {
    ctx.fillStyle = "black";
    ctx.fillRect(c.x, c.y, 30, 15);

    // движение
    c.x += 1;
    if (c.x > canvas.width) c.x = 0;
  });
}

// цикл
function loop() {
  ctx.fillStyle = "#4caf50";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  drawCity();
  drawHouses();
  drawCars();
  update();
  drawPlayer();

  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
