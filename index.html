<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batut Center Dushanbe</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f0f0f;
  color: #eaeaea;
}

header {
  padding: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #333;
}

.lang button {
  background: none;
  border: 1px solid #777;
  color: #fff;
  padding: 6px 12px;
  margin-left: 5px;
  cursor: pointer;
}

.lang button:hover {
  background: #d4af37;
  color: #000;
}

section {
  padding: 60px 20px;
  max-width: 900px;
  margin: auto;
}

h1 {
  font-size: 36px;
  color: #d4af37;
}

.btns a {
  display: inline-block;
  margin: 10px 10px 0 0;
  padding: 14px 22px;
  background: #d4af37;
  color: #000;
  text-decoration: none;
  font-weight: bold;
}
</style>
</head>

<body>

<header>
  <div><b>Batut Center</b></div>
  <div class="lang">
    <button onclick="setLang('ru')">RU</button>
    <button onclick="setLang('en')">EN</button>
  </div>
</header>

<section>
  <h1 id="title">Батутный центр в Душанбе</h1>
  <p id="desc">
    Современный трёхэтажный батутный развлекательный центр для детей и взрослых.
  </p>

  <p id="about">
    Меня зовут Мубориз. Я создал это пространство для радости, спорта и счастья.
  </p>

  <div class="btns">
    <a id="call" href="tel:+992011900303">Позвонить</a>
    <a id="wa" href="https://wa.me/992011900303" target="_blank">WhatsApp</a>
  </div>
</section>

<script>
const content = {
  ru: {
    title: "Батутный центр в Душанбе",
    desc: "Современный трёхэтажный батутный развлекательный центр для детей и взрослых.",
    about: "Меня зовут Мубориз. Я создал это пространство для радости, спорта и счастья.",
    call: "Позвонить",
    wa: "WhatsApp"
  },
  en: {
    title: "Trampoline Center in Dushanbe",
    desc: "A modern three-story trampoline entertainment center for kids and adults.",
    about: "My name is Muboriz. I created this place for joy, sport, and happiness.",
    call: "Call",
    wa: "WhatsApp"
  }
};

function setLang(lang) {
  document.getElementById("title").innerText = content[lang].title;
  document.getElementById("desc").innerText = content[lang].desc;
  document.getElementById("about").innerText = content[lang].about;
  document.getElementById("call").innerText = content[lang].call;
  document.getElementById("wa").innerText = content[lang].wa;
}
</script>

</body>
</html>
