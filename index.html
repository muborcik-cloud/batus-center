<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>City Builder</title>
<style>
body{margin:0;overflow:hidden;font-family:sans-serif;}
canvas{display:block;background:#6bdc6b;}
#ui{position:fixed;top:10px;left:10px;background:rgba(0,0,0,.6);color:#fff;padding:10px;border-radius:10px;}
#buttons{position:fixed;bottom:10px;right:10px;}
button{margin:4px;padding:8px;}
#joy{position:fixed;left:20px;bottom:20px;width:90px;height:90px;background:rgba(255,255,255,.3);border-radius:50%;}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="ui">
💰 <span id="money">0</span><br>
📈 <span id="income">50</span>/сек
</div>

<div id="buttons">
<button onclick="mode='house'">🏠 Дом (50)</button>
<button onclick="mode='road'">🛣 Дорога (20)</button>
<button onclick="mode='light'">🚦 Светофор (30)</button>
<button onclick="mode='car'">🚗 Машина (60)</button>
</div>

<div id="joy"></div>

<script>
const c=document.getElementById("game");
const ctx=c.getContext("2d");
c.width=innerWidth;
c.height=innerHeight;

// ===== СОХРАНЕНИЕ =====
let save=JSON.parse(localStorage.getItem("save2"))||{
 money:200,
 income:50,
 buildings:[],
 roads:[],
 lights:[],
 cars:[]
};

function saveGame(){
 localStorage.setItem("save2",JSON.stringify(save));
}

// ===== ДАННЫЕ =====
let mode=null;
let player={x:0,y:0,speed:4};
let keys={};

// NPC люди
let npcs=[];
for(let i=0;i<10;i++){
 npcs.push({x:Math.random()*1000,y:Math.random()*1000,dir:Math.random()*6});
}

// ===== УПРАВЛЕНИЕ =====
addEventListener("keydown",e=>keys[e.key]=true);
addEventListener("keyup",e=>keys[e.key]=false);

// ===== ДЕНЬГИ =====
setInterval(()=>{
 save.money+=save.income;
 saveGame();
},1000);

// ===== СТРОИТЬ =====
c.addEventListener("click",e=>{
 let x=player.x+(e.clientX-c.width/2);
 let y=player.y+(e.clientY-c.height/2);

 if(mode==="house" && save.money>=50){
  save.money-=50;
  save.buildings.push({x,y});
 }

 if(mode==="road" && save.money>=20){
  save.money-=20;
  save.roads.push({x,y});
 }

 if(mode==="light" && save.money>=30){
  save.money-=30;
  save.lights.push({x,y});
 }

 if(mode==="car" && save.money>=60){
  save.money-=60;
  save.cars.push({x,y,dir:Math.random()*6});
 }
});

// ===== ДЖОЙСТИК =====
let joy=document.getElementById("joy");
let joyX=0,joyY=0;

joy.addEventListener("touchmove",e=>{
 let t=e.touches[0];
 joyX=t.clientX-60;
 joyY=t.clientY-(c.height-60);
});
joy.addEventListener("touchend",()=>{
 joyX=joyY=0;
});

// ===== ДВИЖЕНИЕ =====
function update(){
 if(keys["w"]||joyY<-10) player.y-=player.speed;
 if(keys["s"]||joyY>10) player.y+=player.speed;
 if(keys["a"]||joyX<-10) player.x-=player.speed;
 if(keys["d"]||joyX>10) player.x+=player.speed;

 // машины
 save.cars.forEach(car=>{
  car.x+=Math.cos(car.dir)*2;
  car.y+=Math.sin(car.dir)*2;
 });

 // NPC
 npcs.forEach(n=>{
  n.x+=Math.cos(n.dir);
  n.y+=Math.sin(n.dir);
 });

 // лёгкое движение NPC
}

// ===== ЧЕЛОВЕК =====
function drawHuman(x,y){
 ctx.fillStyle="black";
 ctx.fillRect(x-5,y+10,4,10);
 ctx.fillRect(x+1,y+10,4,10);

 ctx.fillStyle="blue";
 ctx.fillRect(x-8,y-5,16,20);

 ctx.fillRect(x-12,y,6,4);
 ctx.fillRect(x+6,y,6,4);

 ctx.fillStyle="#f5c6a5";
 ctx.beginPath();
 ctx.arc(x,y-12,8,0,Math.PI*2);
 ctx.fill();
}

// ===== РЕНДЕР =====
function draw(){
 ctx.clearRect(0,0,c.width,c.height);

 let camX=player.x-c.width/2;
 let camY=player.y-c.height/2;

 // 🌳 деревья
 ctx.fillStyle="green";
 for(let i=0;i<50;i++){
  let tx=i*120-2000;
  let ty=(i*77)%2000-1000;
  ctx.beginPath();
  ctx.arc(tx-camX,ty-camY,20,0,Math.PI*2);
  ctx.fill();
 }

 // ⛰ горы
 ctx.fillStyle="#999";
 for(let i=0;i<10;i++){
  let x=i*300-1500;
  ctx.beginPath();
  ctx.moveTo(x-camX,300-camY);
  ctx.lineTo(x+80-camX,150-camY);
  ctx.lineTo(x+160-camX,300-camY);
  ctx.fill();
 }

 // дороги
 ctx.fillStyle="#555";
 save.roads.forEach(r=>{
  ctx.fillRect(r.x-camX,r.y-camY,40,40);
 });

 // светофоры
 save.lights.forEach(l=>{
  ctx.fillStyle="black";
  ctx.fillRect(l.x-camX,l.y-camY,10,20);
  ctx.fillStyle="red";
  ctx.fillRect(l.x-camX+2,l.y-camY+2,6,6);
 });

 // дома
 save.buildings.forEach(b=>{
  ctx.fillStyle="red";
  ctx.fillRect(b.x-camX,b.y-camY,30,30);
 });

 // машины
 save.cars.forEach(car=>{
  ctx.fillStyle="black";
  ctx.fillRect(car.x-camX,car.y-camY,20,10);
 });

 // NPC
 npcs.forEach(n=>{
  drawHuman(n.x-camX,n.y-camY);
 });

 // игрок
 drawHuman(c.width/2,c.height/2);

 // UI
 money.innerText=Math.floor(save.money);
 income.innerText=save.income;
}

// ===== ЦИКЛ =====
function loop(){
 update();
 draw();
 requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
