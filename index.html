<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Батутный центр Душанбе №1</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
 --bg:#0b0c10;
 --card:#16181d;
 --gold:#f5c25c;
 --text:#f2f2f2;
 --muted:#9aa0a6;
}

*{box-sizing:border-box}
body{
 margin:0;
 font-family:Inter,sans-serif;
 background:var(--bg);
 color:var(--text);
 font-size:15px;
 line-height:1.7;
}

h1{font-size:38px}
h2{font-size:28px}
h3{font-size:18px}
p{color:var(--muted)}

section{
 max-width:1200px;
 margin:auto;
 padding:90px 20px;
}

.center{text-align:center}

/* HERO */
.hero{
 position:relative;
 height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
 overflow:hidden;
}
.hero video{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 object-fit:cover;
 filter:brightness(.35);
}
.hero .box{
 position:relative;
 z-index:2;
 max-width:900px;
 animation:up 1.3s ease;
}
@keyframes up{
 from{opacity:0;transform:translateY(50px)}
 to{opacity:1;transform:none}
}

/* BUTTONS */
.btns{
 display:flex;
 gap:14px;
 justify-content:center;
 flex-wrap:wrap;
 margin-top:30px;
}
.btn{
 padding:14px 24px;
 border-radius:16px;
 font-weight:600;
 font-size:14px;
 text-decoration:none;
}
.gold{background:var(--gold);color:#000}
.line{border:1px solid var(--gold);color:var(--gold)}
.wh{background:#25d366;color:#000}

/* GRID */
.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
 gap:24px;
}
.card{
 background:var(--card);
 padding:28px;
 border-radius:20px;
 border:1px solid #232323;
 transition:.4s;
}
.card:hover{
 transform:translateY(-10px);
 border-color:var(--gold);
}

/* STATS */
.stats{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
 gap:24px;
 text-align:center;
}
.stat{
 font-size:34px;
 font-weight:700;
 color:var(--gold);
}

/* SLIDER */
.slider{
 display:flex;
 gap:18px;
 overflow-x:auto;
}
.slider img, .slider video{
 width:320px;
 height:220px;
 object-fit:cover;
 border-radius:18px;
}

/* FORM */
form{
 max-width:520px;
 margin:auto;
 display:grid;
 gap:14px;
}
input,button{
 padding:14px;
 border-radius:14px;
 border:none;
 font-size:14px;
}
input{background:#1b1d22;color:#fff}
button{background:var(--gold);font-weight:700}

/* MAP */
iframe{
 width:100%;
 height:360px;
 border:none;
 border-radius:20px;
}

/* FIXED */
.fixed{
 position:fixed;
 right:20px;
 bottom:20px;
 background:#25d366;
 color:#000;
 padding:14px 18px;
 border-radius:999px;
 font-weight:700;
 z-index:99;
}

.lang{
 position:fixed;
 top:20px;
 right:20px;
 z-index:99;
}
.lang button{
 background:#000;
 color:#fff;
 border:1px solid #333;
 padding:6px 10px;
 margin-left:6px;
}

footer{
 text-align:center;
 padding:30px;
 color:#777;
 font-size:13px;
}
</style>
</head>

<body>

<div class="lang">
 <button onclick="setLang('ru')">RU</button>
 <button onclick="setLang('en')">EN</button>
</div>

<a class="fixed" href="https://wa.me/992011900303">WhatsApp</a>

<div class="hero">
 <video autoplay muted loop playsinline>
  <source src="https://cdn.coverr.co/videos/coverr-kids-playing-4260/1080p.mp4">
 </video>
 <div class="box">
  <h1 data-ru="Батутный центр №1 в Душанбе"
      data-en="Trampoline Center №1 in Dushanbe"></h1>
  <p data-ru="Максимальная безопасность • Радость • Профессиональный уровень"
     data-en="Maximum safety • Joy • Professional level"></p>
  <div class="btns">
   <a class="btn gold" href="tel:+992011900303"
      data-ru="Позвонить" data-en="Call"></a>
   <a class="btn wh" href="https://wa.me/992011900303">WhatsApp</a>
   <a class="btn line" href="#map"
      data-ru="Маршрут" data-en="Directions"></a>
  </div>
 </div>
</div>

<section class="center">
 <h2 data-ru="Нам доверяют" data-en="Trusted by"></h2>
 <div class="stats">
  <div><div class="stat">10 000+</div><p>Детей</p></div>
  <div><div class="stat">5 лет</div><p>Опыт</p></div>
  <div><div class="stat">100%</div><p>Безопасность</p></div>
 </div>
</section>

<section>
 <h2 class="center" data-ru="Фото и видео" data-en="Photos & Videos"></h2>
 <div class="slider">
  <img src="https://images.unsplash.com/photo-1601999109332-5429a7f1d15c">
  <video autoplay muted loop>
   <source src="https://cdn.coverr.co/videos/coverr-kids-jumping-4385/1080p.mp4">
  </video>
  <img src="https://images.unsplash.com/photo-1596464716127-f2a82984de30">
 </div>
</section>

<section>
 <h2 class="center" data-ru="Цены" data-en="Prices"></h2>
 <div class="grid">
  <div class="card"><h3>1 час</h3><p><b style="color:var(--gold)">100 сомони</b></p></div>
  <div class="card"><h3>2 часа</h3><p><b style="color:var(--gold)">200 сомони</b></p></div>
  <div class="card"><h3>Безлимит</h3><p><b style="color:var(--gold)">400 сомони</b></p></div>
 </div>
</section>

<section>
 <h2 class="center" data-ru="Отзывы родителей" data-en="Parents reviews"></h2>
 <div class="grid">
  <div class="card">⭐️⭐️⭐️⭐️⭐️<p>Лучшее место в Душанбе</p></div>
  <div class="card">⭐️⭐️⭐️⭐️⭐️<p>Очень безопасно и красиво</p></div>
  <div class="card">⭐️⭐️⭐️⭐️⭐️<p>Дети счастливы!</p></div>
 </div>
</section>

<section>
 <h2 class="center" data-ru="Оставить заявку" data-en="Send request"></h2>
 <form onsubmit="sendWA(event)">
  <input id="name" placeholder="Имя / Name">
  <input id="phone" placeholder="Телефон / Phone">
  <button data-ru="Отправить" data-en="Send"></button>
 </form>
</section>

<section id="map">
 <h2 class="center" data-ru="Как нас найти" data-en="How to find us"></h2>
 <iframe src="https://maps.google.com/maps?q=Dushanbe&z=13&output=embed"></iframe>
</section>

<footer>
 © 2025 Батутный центр Душанбе • ABSOLUTE LEGEND LEVEL
</footer>

<script>
function setLang(l){
 document.querySelectorAll('[data-ru]').forEach(e=>{
  e.textContent = e.dataset[l];
 });
}
setLang('ru');

function sendWA(e){
 e.preventDefault();
 let n=document.getElementById('name').value;
 let p=document.getElementById('phone').value;
 window.open(`https://wa.me/992011900303?text=Заявка:%0AИмя:${n}%0AТелефон:${p}`);
}
</script>

</body>
</html>
