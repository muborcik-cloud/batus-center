<head>

body { margin:0; overflow:hidden; }
#ui {
 position:fixed; top:10px; left:10px;

}
</style>
</head>

❤️ <span id="hp">100</span><br>
🎯 Миссия: доехать до точки
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158/build/three.min.js"></script>

<script>
let scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

let camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
let renderer = new THREE.WebGLRenderer();
renderer.setSize(innerWidth, innerHeight);

let light = new THREE.DirectionalLight(0xffffff,1);
light.position.set(10,20,10);
scene.add(light);

let ground = new THREE.Mesh(
 new THREE.PlaneGeometry(400,400),
 new THREE.MeshStandardMaterial({color:0x228B22})
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

let player = new THREE.Mesh(
 new THREE.BoxGeometry(1,2,1),
 new THREE.MeshStandardMaterial({color:0x0000ff})
);
player.position.y=1;
scene.add(player);

// машина
let car = new THREE.Mesh(
 new THREE.BoxGeometry(2,1,4),
 new THREE.MeshStandardMaterial({color:0xff0000})
);
car.position.set(5,0.5,5);
scene.add(car);

let inCar=false, speed=0, angle=0;

// миссия
let goal = new THREE.Mesh(
 new THREE.SphereGeometry(1,16,16),
 new THREE.MeshStandardMaterial({color:0xffff00})
);
goal.position.set(20,1,20);
scene.add(goal);

// полиция
let police=[];
for(let i=0;i<3;i++){
 let p=new THREE.Mesh(
  new THREE.BoxGeometry(2,1,4),
  new THREE.MeshStandardMaterial({color:0xffffff})
 );
 p.position.set(Math.random()*50,0.5,Math.random()*50);
 scene.add(p);
 police.push(p);
}

// данные
let hp=100, money=0;

// управление
let keys={};
document.addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;

 if(e.key==="e"){
  if(player.position.distanceTo(car.position)<3){
   inCar=!inCar;
  }
 }
});
document.addEventListener("keyup",e=>{
 keys[e.key.toLowerCase()]=false;
});
