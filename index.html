<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Батутный центр Душанбе — Премиум</title>

<!-- SEO -->
<meta name="description" content="Лучший батутный центр в Душанбе. 3 этажа развлечений, безопасность, цены, карта, WhatsApp, заявка онлайн.">
<meta name="keywords" content="батутный центр Душанбе, батуты Душанбе, детский центр, развлечения для детей">

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
 --bg:#0b0d12;
 --panel:#141722;
 --gold:#f7c76a;
 --text:#f5f6fa;
 --muted:#9aa0b4;
 --green:#25d366;
}

*{box-sizing:border-box;margin:0;padding:0}
body{
 font-family:Poppins,system-ui,sans-serif;
 background:var(--bg);
 color:var(--text);
 line-height:1.6;
}

h1{font-size:44px}
h2{font-size:30px;margin-bottom:20px}
h3{font-size:18px}
p{color:var(--muted)}

section{
 max-width:1300px;
 margin:auto;
 padding:90px 24px;
}

.center{text-align:center}

/* HERO */
.hero{
 position:relative;
 height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
 overflow:hidden;
}
.hero video{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 object-fit:cover;
 filter:brightness(.3);
}
.hero::after{
 content:"";
 position:absolute;
 inset:0;
 background:radial-gradient(circle at top, transparent, #000 70%);
}
.hero-content{
 position:relative;
 z-index:2;
 max-width:900px;
 animation:hero 1.2s ease;
}
@keyframes hero{
 from{opacity:0;transform:translateY(50px)}
 to{opacity:1;transform:none}
}

/* BUTTONS */
.actions{
 display:flex;
 justify-content:center;
 gap:16px;
 flex-wrap:wrap;
 margin-top:30px;
}
.btn{
 padding:15px 26px;
 border-radius:16px;
 font-weight:600;
 font-size:15px;
 text-decoration:none;
 transition:.35s;
}
.btn.gold{background:var(--gold);color:#000}
.btn.outline{border:1px solid var(--gold);color:var(--gold)}
.btn.wh{background:var(--green);color:#000}
.btn:hover{transform:translateY(-3px) scale(1.02)}

/* FIXED CTA */
.fixed{
 position:fixed;
 right:22px;
 bottom:22px;
 background:var(--green);
 color:#000;
 padding:14px 20px;
 border-radius:999px;
 font-weight:700;
 text-decoration:none;
 z-index:99;
}
.call{
 position:fixed;
 right:22px;
 bottom:86px;
 background:var(--gold);
 color:#000;
 padding:14px 20px;
 border-radius:999px;
 font-weight:700;
 text-decoration:none;
 z-index:99;
}

/* GRID */
.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
 gap:24px;
}
.card{
 background:linear-gradient(180deg,#161a2a,#0f111a);
 border:1px solid #24283b;
 border-radius:22px;
 padding:30px;
 transition:.4s;
}
.card:hover{
 transform:translateY(-10px);
 border-color:var(--gold);
 box-shadow:0 30px 80px rgba(0,0,0,.6);
}

/* STATS */
.stats{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
 gap:30px;
 text-align:center;
}
.stat{
 font-size:40px;
 font-weight:700;
 color:var(--gold);
}

/* GALLERY */
.gallery{
 display:flex;
 gap:20px;
 overflow-x:auto;
 padding-bottom:10px;
}
.gallery img,.gallery video{
 width:340px;
 height:220px;
 object-fit:cover;
 border-radius:20px;
}

/* FORM */
form{
 max-width:520px;
 margin:auto;
 display:grid;
 gap:16px;
}
input,button{
 padding:15px;
 border-radius:14px;
 border:none;
 font-size:14px;
}
input{background:#1c2033;color:#fff}
button{background:var(--gold);font-weight:700;cursor:pointer}

/* MAP */
iframe{
 width:100%;
 height:380px;
 border:none;
 border-radius:24px;
}

/* LANG */
.lang{
 position:fixed;
 top:16px;
 right:16px;
 z-index:99;
}
.lang button{
 background:#000;
 color:#fff;
 border:1px solid #333;
 padding:6px 12px;
 border-radius:10px;
 margin-left:6px;
}

/* FOOTER */
footer{
 text-align:center;
 padding:40px 20px;
 font-size:13px;
 color:#777;
 border-top:1px solid #222;
}
</style>
</head>

<body>

<div class="lang">
 <button onclick="setLang('ru')">RU</button>
 <button onclick="setLang('en')">EN</button>
</div>

<a class="fixed" href="https://wa.me/992011900303">WhatsApp</a>
<a class="call" href="tel:+992011900303">Позвонить</a>

<!-- HERO -->
<div class="hero">
 <video autoplay muted loop playsinline>
  <source src="https://cdn.coverr.co/videos/coverr-kids-playing-4260/1080p.mp4">
 </video>
 <div class="hero-content">
  <h1 data-ru="Легендарный батутный центр в Душанбе"
      data-en="Legendary Trampoline Center in Dushanbe"></h1>
  <p data-ru="Трёхэтажный центр • Безопасность • Радость • Премиум уровень"
     data-en="Three floors • Safety • Joy • Premium level"></p>
  <div class="actions">
   <a class="btn gold" href="#form"
      data-ru="Оставить заявку" data-en="Send request"></a>
   <a class="btn wh" href="https://wa.me/992011900303">WhatsApp</a>
   <a class="btn outline" href="#map"
      data-ru="Построить маршрут" data-en="Build route"></a>
  </div>
 </div>
</div>

<!-- ABOUT -->
<section>
 <h2 class="center" data-ru="Кто мы" data-en="Who we are"></h2>
 <p class="center" data-ru="Мы — современный батутный центр в Душанбе. 3 этажа развлечений, сертифицированное оборудование и абсолютная безопасность."
    data-en="We are a modern trampoline center in Dushanbe. 3 floors of fun, certified equipment and total safety."></p>
</section>

<!-- STATS -->
<section>
 <div class="stats">
  <div><div class="stat">15 000+</div><p>Детей</p></div>
  <div><div class="stat">3</div><p>Этажа</p></div>
  <div><div class="stat">100%</div><p>Безопасность</p></div>
 </div>
</section>

<!-- GALLERY -->
<section>
 <h2 class="center" data-ru="Галерея" data-en="Gallery"></h2>
 <div class="gallery">
  <video autoplay muted loop>
   <source src="https://cdn.coverr.co/videos/coverr-kids-jumping-4385/1080p.mp4">
  </video>
  <img src="https://images.unsplash.com/photo-1596464716127-f2a82984de30">
  <img src="https://images.unsplash.com/photo-1601999109332-5429a7f1d15c">
 </div>
</section>

<!-- PRICES -->
<section>
 <h2 class="center" data-ru="Цены" data-en="Prices"></h2>
 <div class="grid">
  <div class="card"><h3>1 час</h3><p><b style="color:var(--gold)">100 сомони</b></p></div>
  <div class="card"><h3>2 часа</h3><p><b style="color:var(--gold)">200 сомони</b></p></div>
  <div class="card"><h3>Безлимит</h3><p><b style="color:var(--gold)">400 сомони</b></p></div>
 </div>

<section>

 <div class="grid">

  <div class="card">★★★★★<p>Безопасно и красиво</p></div>
  <div class="card">★★★★★<p>Дети счастливы</p></div>
 </div>
</section>

<!-- FORM -->
<section id="form">
 <h2 class="center" data-ru="Оставить заявку" data-en="Send request"></h2>
 <form onsubmit="sendWA(event)">
  <input id="name" placeholder="Имя / Name" required>
  <input id="phone" placeholder="Телефон / Phone" required>
  <button data-ru="Отправить в WhatsApp" data-en="Send to WhatsApp"></button>
 </form>
</section>

<!-- MAP -->
<section id="map">
 <h2 class="center" data-ru="Как нас найти" data-en="How to find us"></h2>
 <iframe src="https://maps.google.com/maps?q=Dushanbe&z=13&output=embed"></iframe>
</section>

<footer>
 © 2025 Батутный центр Душанбе • BOSS + GOD MODE
</footer>

<script>
function setLang(l){
 document.querySelectorAll('[data-ru]').forEach(e=>{
  e.textContent = e.dataset[l];
 });
}
setLang('ru');

function sendWA(e){
 e.preventDefault();
 const n=document.getElementById('name').value;
 const p=document.getElementById('phone').value;
 window.open(`https://wa.me/992011900303?text=Заявка:%0AИмя:${n}%0AТелефон:${p}`);
}
</script>

</body>
</html>
