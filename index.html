<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Батутный центр в Душанбе</title>

<style>
:root{
  --gold:#f5c542;
  --dark:#0e0e0e;
  --gray:#bfbfbf;
}

*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}

body{
  background:linear-gradient(180deg,#0e0e0e,#161616);
  color:white;
  line-height:1.6;
}

/* HEADER */
header{
  padding:40px 20px;
  text-align:center;
}
header h1{
  font-size:32px;
  color:var(--gold);
  margin-bottom:10px;
}
header p{
  font-size:16px;
  color:var(--gray);
}

/* BUTTONS */
.buttons{
  display:flex;
  gap:12px;
  justify-content:center;
  flex-wrap:wrap;
  margin-top:20px;
}
.btn{
  padding:12px 22px;
  border-radius:8px;
  text-decoration:none;
  font-weight:bold;
  font-size:15px;
}
.call{background:var(--gold);color:black}
.whatsapp{background:#25D366;color:black}
.apply{border:2px solid var(--gold);color:var(--gold)}

/* SECTIONS */
section{
  padding:50px 20px;
  max-width:1100px;
  margin:auto;
}
h2{
  font-size:26px;
  color:var(--gold);
  margin-bottom:20px;
  text-align:center;
}
p{font-size:16px;color:#ddd}

/* CARDS */
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px;
  margin-top:30px;
}
.card{
  background:#1c1c1c;
  padding:25px;
  border-radius:12px;
  border:1px solid #2b2b2b;
}
.card h3{
  color:var(--gold);
  margin-bottom:10px;
}

/* PRICES */
.price{
  font-size:22px;
  font-weight:bold;
  margin-top:10px;
}

/* MAP */
iframe{
  width:100%;
  height:350px;
  border-radius:12px;
  border:none;
  margin-top:20px;
}

/* FOOTER */
footer{
  padding:30px 20px;
  text-align:center;
  color:#888;
  font-size:14px;
}

/* LANGUAGE */
.lang{
  position:fixed;
  top:15px;
  right:15px;
}
.lang button{
  background:#1f1f1f;
  color:white;
  border:1px solid #333;
  padding:6px 12px;
  border-radius:6px;
  cursor:pointer;
  margin-left:5px;
}
</style>

<script>
function setLang(l){
  document.querySelectorAll('[data-ru]').forEach(el=>{
    el.innerText = l==='ru' ? el.dataset.ru : el.dataset.en;
  });
}
</script>
</head>

<body onload="setLang('ru')">

<div class="lang">
  <button onclick="setLang('ru')">RU</button>
  <button onclick="setLang('en')">EN</button>
</div>

<header>
  <h1 data-ru="Батутный центр в Душанбе" data-en="Trampoline Center in Dushanbe"></h1>
  <p data-ru="Современный детский развлекательный центр. Только в городе Душанбе."
     data-en="Modern children entertainment center. Only in Dushanbe."></p>

  <div class="buttons">
    <a href="tel:+992011900303" class="btn call">Позвонить</a>
    <a href="https://wa.me/992011900303" class="btn whatsapp">WhatsApp</a>
    <a href="#form" class="btn apply">Оставить заявку</a>
  </div>
</header>

<section>
  <h2 data-ru="О нас" data-en="About us"></h2>
  <p data-ru="Я Мубориз. Я создаю и развиваю профессиональный батутный центр для детей и семей. У нас безопасно, ярко и весело."
     data-en="My name is Muboriz. I run a professional trampoline center for kids and families. Safe, bright and fun."></p>
</section>

<section>
  <h2 data-ru="Цены" data-en="Prices"></h2>
  <div class="cards">
    <div class="card">
      <h3 data-ru="Стандарт" data-en="Standard"></h3>
      <p>1 час</p>
      <div class="price">100 сомони</div>
    </div>
    <div class="card">
      <h3 data-ru="Комфорт" data-en="Comfort"></h3>
      <p>2 часа</p>
      <div class="price">200 сомони</div>
    </div>
    <div class="card">
      <h3 data-ru="Премиум" data-en="Premium"></h3>
      <p data-ru="Без ограничений" data-en="Unlimited"></p>
      <div class="price">400 сомони</div>
    </div>
  </div>
</section>

<section>
  <h2 data-ru="Как нас найти" data-en="How to find us"></h2>
  <iframe src="https://maps.google.com/maps?q=Dushanbe&t=&z=13&ie=UTF8&iwloc=&output=embed"></iframe>
</section>

<section id="form">
  <h2 data-ru="Оставить заявку" data-en="Send request"></h2>
  <p data-ru="Позвоните нам или напишите в WhatsApp — мы ответим сразу."
     data-en="Call us or message us on WhatsApp — we reply instantly."></p>
</section>

<footer>
  © 2025 Батутный центр • Душанбе
</footer>

</body>
</html>
