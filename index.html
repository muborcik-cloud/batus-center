<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>My City Game</title>
<style>
body{margin:0;overflow:hidden;font-family:sans-serif;}
canvas{display:block;background:#6bdc6b;}
#ui{position:fixed;top:10px;left:10px;background:rgba(0,0,0,.6);color:#fff;padding:10px;}
#buttons{position:fixed;bottom:10px;right:10px;}
button{margin:4px;padding:8px;}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="ui">
💰 <span id="money">0</span><br>
📈 <span id="income">50</span>/сек
</div>

<div id="buttons">
<button onclick="mode='house'">🏠 Дом</button>
<button onclick="mode='shop'">🏪 Магазин</button>
<button onclick="mode='hotel'">🏨 Отель</button>
<button onclick="mode='hospital'">🏥 Больница</button>
<button onclick="mode='tower'">🏢 Башня</button>
<button onclick="mode='car'">🚗 Машина</button>
<button onclick="upgrade()">⬆️ Улучшить</button>
</div>

<script>
const c=document.getElementById("game");
const ctx=c.getContext("2d");
c.width=innerWidth;
c.height=innerHeight;

// сохранение
let save=JSON.parse(localStorage.getItem("city"))||{
 money:200,
 income:50,
 buildings:[],
 cars:[]
};

function saveGame(){
 localStorage.setItem("city",JSON.stringify(save));
}

let player={x:0,y:0,speed:4};
let keys={},mode=null;

// NPC
let npcs=[];
for(let i=0;i<10;i++){
 npcs.push({x:Math.random()*1000,y:Math.random()*1000});
}

// деньги
setInterval(()=>{
 save.money+=save.income;
 saveGame();
},1000);

// управление
addEventListener("keydown",e=>keys[e.key]=true);
addEventListener("keyup",e=>keys[e.key]=false);

// стройка
c.addEventListener("click",e=>{
 let x=player.x+(e.clientX-c.width/2);
 let y=player.y+(e.clientY-c.height/2);

 if(mode==="house"&&save.money>=50){
  save.money-=50;
  save.buildings.push({x,y,type:"house"});
 }
 if(mode==="shop"&&save.money>=80){
  save.money-=80;
  save.buildings.push({x,y,type:"shop"});
 }
 if(mode==="hotel"&&save.money>=150){
  save.money-=150;
  save.buildings.push({x,y,type:"hotel"});
 }
 if(mode==="hospital"&&save.money>=150){
  save.money-=150;
  save.buildings.push({x,y,type:"hospital"});
 }
 if(mode==="tower"&&save.money>=200){
  save.money-=200;
  save.buildings.push({x,y,type:"tower"});
 }
 if(mode==="car"&&save.money>=60){
  save.money-=60;
  save.cars.push({x,y});
 }
});

// улучшение
function upgrade(){
 if(save.money>=100){
  save.money-=100;
  save.income+=20;
 }
}

// движение
function update(){
 if(keys["w"])player.y-=player.speed;
 if(keys["s"])player.y+=player.speed;
 if(keys["a"])player.x-=player.speed;
 if(keys["d"])player.x+=player.speed;

 save.cars.forEach(car=>{
  car.x+=1;
  if(car.x>2000)car.x=-2000;
 });
}

// человек
function drawHuman(x,y){
 ctx.fillStyle="black";
 ctx.fillRect(x-5,y+10,4,10);
 ctx.fillRect(x+1,y+10,4,10);

 ctx.fillStyle="blue";
 ctx.fillRect(x-8,y-5,16,20);

 ctx.fillRect(x-12,y,6,4);
 ctx.fillRect(x+6,y,6,4);

 ctx.fillStyle="#f5c6a5";
 ctx.beginPath();
 ctx.arc(x,y-12,8,0,Math.PI*2);
 ctx.fill();
}

// рендер
function draw(){
 ctx.clearRect(0,0,c.width,c.height);

 let camX=player.x-c.width/2;
 let camY=player.y-c.height/2;

 // дороги
 ctx.fillStyle="#777";
 for(let x=-2000;x<2000;x+=200){
  ctx.fillRect(x-camX,-2000-camY,40,4000);
 }
 for(let y=-2000;y<2000;y+=200){
  ctx.fillRect(-2000-camX,y-camY,4000,40);
 }

 // здания
 save.buildings.forEach(b=>{
  if(b.type==="house")ctx.fillStyle="red";
  if(b.type==="shop")ctx.fillStyle="blue";
  if(b.type==="hotel")ctx.fillStyle="purple";
  if(b.type==="hospital")ctx.fillStyle="white";
  if(b.type==="tower")ctx.fillStyle="black";

  let h=b.type==="tower"?80:30;
  ctx.fillRect(b.x-camX,b.y-camY,30,h);
 });

 // машины
 save.cars.forEach(car=>{
  ctx.fillStyle="black";
  ctx.fillRect(car.x-camX,car.y-camY,20,10);
 });

 // NPC
 npcs.forEach(n=>drawHuman(n.x-camX,n.y-camY));

 // игрок
 drawHuman(c.width/2,c.height/2);

 money.innerText=Math.floor(save.money);
 income.innerText=save.income;
}

// цикл
function loop(){
 update();
 draw();
 requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
