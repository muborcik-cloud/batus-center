<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Батутный центр в Душанбе — лучший для детей</title>
<meta name="description" content="Современный батутный центр в Душанбе. Безопасность, радость, праздники. Звоните +992 011 900 303">
<meta name="keywords" content="батутный центр Душанбе, батуты дети, развлечения Душанбе">
<meta name="author" content="Мубориз">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
 --bg:#0e0e11;
 --card:#18181d;
 --gold:#f5c25c;
 --text:#f2f2f2;
 --muted:#9b9b9b;
}

*{box-sizing:border-box}
body{
 margin:0;
 font-family:Inter,sans-serif;
 background:var(--bg);
 color:var(--text);
 font-size:16px;
 line-height:1.6;
}

h1{font-size:40px}
h2{font-size:30px}
h3{font-size:20px}
p{color:var(--muted)}

section{
 max-width:1200px;
 margin:auto;
 padding:80px 20px;
}

.center{text-align:center}

/* HERO */
.hero{
 position:relative;
 height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
}
.hero video{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 object-fit:cover;
 filter:brightness(.35);
}
.hero .box{
 position:relative;
 z-index:2;
 max-width:850px;
 animation:fadeUp 1.2s ease;
}
@keyframes fadeUp{
 from{opacity:0;transform:translateY(40px)}
 to{opacity:1;transform:none}
}

/* BUTTONS */
.btns{
 display:flex;
 gap:14px;
 justify-content:center;
 flex-wrap:wrap;
 margin-top:25px;
}
.btn{
 padding:14px 22px;
 border-radius:14px;
 font-weight:600;
 font-size:15px;
 text-decoration:none;
}
.btn.gold{background:var(--gold);color:#000}
.btn.line{border:1px solid var(--gold);color:var(--gold)}
.btn.wh{background:#25d366;color:#000}

/* GRID */
.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
 gap:22px;
}
.card{
 background:var(--card);
 padding:26px;
 border-radius:18px;
 border:1px solid #232323;
 transition:.4s;
}
.card:hover{
 transform:translateY(-8px);
 border-color:var(--gold);
}

/* SLIDER */
.slider{
 display:flex;
 gap:16px;
 overflow-x:auto;
 scroll-snap-type:x mandatory;
}
.slider img{
 width:300px;
 height:220px;
 object-fit:cover;
 border-radius:14px;
 scroll-snap-align:start;
}

/* FORM */
form{
 max-width:520px;
 margin:auto;
 display:grid;
 gap:14px;
}
input,button{
 padding:14px;
 border-radius:12px;
 border:none;
 font-size:15px;
}
input{
 background:#1c1c1c;
 color:#fff;
}
button{
 background:var(--gold);
 font-weight:700;
 cursor:pointer;
}

/* MAP */
iframe{
 width:100%;
 height:360px;
 border:none;
 border-radius:18px;
}

/* FIXED */
.fixed{
 position:fixed;
 right:20px;
 bottom:20px;
 background:#25d366;
 color:#000;
 padding:14px 18px;
 border-radius:999px;
 font-weight:700;
 z-index:99;
}

.lang{
 position:fixed;
 top:20px;
 right:20px;
 z-index:99;
}
.lang button{
 background:#000;
 color:#fff;
 border:1px solid #333;
 padding:6px 10px;
 margin-left:6px;
}

footer{
 text-align:center;
 padding:30px;
 color:#777;
 font-size:14px;
}
</style>
</head>

<body>

<div class="lang">
 <button onclick="setLang('ru')">RU</button>
 <button onclick="setLang('en')">EN</button>
</div>

<a class="fixed" href="https://wa.me/992011900303">WhatsApp</a>

<div class="hero">
 <video autoplay muted loop playsinline>
  <source src="https://cdn.coverr.co/videos/coverr-kids-playing-4260/1080p.mp4">
 </video>
 <div class="box">
  <h1 data-ru="Лучший батутный центр в Душанбе"
      data-en="The best trampoline center in Dushanbe"></h1>
  <p data-ru="Безопасно • Весело • Профессионально"
     data-en="Safe • Fun • Professional"></p>
  <div class="btns">
   <a class="btn gold" href="tel:+992011900303"
      data-ru="Позвонить" data-en="Call"></a>
   <a class="btn wh" href="https://wa.me/992011900303">WhatsApp</a>
   <a class="btn line" href="#map"
      data-ru="Маршрут" data-en="Directions"></a>
  </div>
 </div>
</div>

<section class="center">
 <h2 data-ru="Почему выбирают нас" data-en="Why choose us"></h2>
 <div class="grid">
  <div class="card"><h3 data-ru="Безопасность" data-en="Safety"></h3><p>Мягкие зоны и контроль</p></div>
  <div class="card"><h3 data-ru="Оборудование" data-en="Equipment"></h3><p>Современные батуты</p></div>
  <div class="card"><h3 data-ru="Праздники" data-en="Parties"></h3><p>Дни рождения и шоу</p></div>
 </div>
</section>

<section>
 <h2 class="center" data-ru="Галерея" data-en="Gallery"></h2>
 <div class="slider">
  <img src="https://images.unsplash.com/photo-1601999109332-5429a7f1d15c">
  <img src="https://images.unsplash.com/photo-1596464716127-f2a82984de30">
  <img src="https://images.unsplash.com/photo-1588075592446-8a8f78a65f5b">
 </div>
</section>

<section>
 <h2 class="center" data-ru="Цены" data-en="Prices"></h2>
 <div class="grid">
  <div class="card"><h3>1 час</h3><p><b style="color:var(--gold)">100 сомони</b></p></div>
  <div class="card"><h3>2 часа</h3><p><b style="color:var(--gold)">200 сомони</b></p></div>
  <div class="card"><h3>Безлимит</h3><p><b style="color:var(--gold)">400 сомони</b></p></div>
 </div>
</section>

<section>
 <h2 class="center" data-ru="Заявка" data-en="Request"></h2>
 <form onsubmit="sendWA(event)">
  <input id="name" placeholder="Имя / Name">
  <input id="phone" placeholder="Телефон / Phone">
  <button data-ru="Отправить" data-en="Send"></button>
 </form>
</section>

<section id="map">
 <h2 class="center" data-ru="Как нас найти" data-en="How to find us"></h2>
 <iframe src="https://maps.google.com/maps?q=Dushanbe&z=13&output=embed"></iframe>
</section>

<footer>
 © 2025 Батутный центр Душанбе • ULTRA LEGENDARY LEVEL
</footer>

<script>
function setLang(l){
 document.querySelectorAll('[data-ru]').forEach(e=>{
  e.textContent = e.dataset[l];
 });
}
setLang('ru');

function sendWA(e){
 e.preventDefault();
 let n=document.getElementById('name').value;
 let p=document.getElementById('phone').value;
 window.open(`https://wa.me/992011900303?text=Заявка:%0AИмя:${n}%0AТелефон:${p}`);
}
</script>

</body>
</html>
