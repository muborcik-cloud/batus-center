<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>BATUS — детский развлекательный центр</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0b0f;
      color: #ffffff;
    }

    .screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 20px;
    }

    p {
      font-size: 20px;
      max-width: 700px;
      opacity: 0.85;
    }

    .tag {
      display: inline-block;
      margin-bottom: 20px;
      padding: 8px 16px;
      border-radius: 30px;
      background: linear-gradient(90deg, #ffcc00, #ff6a00);
      color: #000;
      font-weight: bold;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <section class="screen">
    <div>
      <div class="tag">Детский развлекательный центр</div>
      <h1>BATUS</h1>
      <p>
        Пространство, где дети счастливы,  
        а родители спокойны.
      </p>
    </div>
  </section>

</body>
</html>
