<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Ultra Life Game</title>
<style>
body{margin:0;overflow:hidden;}
#joy{
 position:absolute;bottom:20px;left:20px;
 width:100px;height:100px;
 background:rgba(255,255,255,0.3);
 border-radius:50%;
}
#stick{
 width:40px;height:40px;
 background:white;border-radius:50%;
 position:absolute;left:30px;top:30px;
}
#shoot{
 position:absolute;bottom:20px;right:20px;
 padding:10px;font-size:20px;
}
#money{
 position:absolute;top:10px;left:10px;
 background:black;color:white;padding:8px;
}
</style>
</head>
<body>

<div id="money">💰 0</div>
<div id="joy"><div id="stick"></div></div>
<button id="shoot">🔫</button>

<script src="https://cdn.jsdelivr.net/npm/three@0.158/build/three.min.js"></script>

<script>
// сцена
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);

// камера
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);

// рендер
const renderer=new THREE.WebGLRenderer();
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

// свет
const light=new THREE.DirectionalLight(0xffffff,1);
light.position.set(10,20,10);
scene.add(light);

// земля
const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(200,200),
 new THREE.MeshStandardMaterial({color:0x55aa55})
);
ground.rotation.x=-Math.PI/2;
scene.add(ground);

// игрок
const player=new THREE.Group();

// тело
let body=new THREE.Mesh(new THREE.BoxGeometry(1,1.5,0.6),
 new THREE.MeshStandardMaterial({color:0x0000ff}));
body.position.y=1;
player.add(body);

// голова
let head=new THREE.Mesh(new THREE.SphereGeometry(0.4,16,16),
 new THREE.MeshStandardMaterial({color:0xffcc99}));
head.position.y=2;
player.add(head);

// ноги
let leg1=new THREE.Mesh(new THREE.BoxGeometry(0.3,1,0.3),
 new THREE.MeshStandardMaterial({color:0x000088}));
leg1.position.set(-0.3,0.3,0);
player.add(leg1);

let leg2=leg1.clone();
leg2.position.x=0.3;
player.add(leg2);

scene.add(player);

// город
for(let i=0;i<80;i++){
 let h=Math.random()*10+5;
 let b=new THREE.Mesh(
  new THREE.BoxGeometry(2,h,2),
  new THREE.MeshStandardMaterial({color:0x888888})
 );
 b.position.set(Math.random()*100-50,h/2,Math.random()*100-50);
 scene.add(b);
}

// деревья
for(let i=0;i<40;i++){
 let t=new THREE.Mesh(
  new THREE.ConeGeometry(1,3,8),
  new THREE.MeshStandardMaterial({color:0x228B22})
 );
 t.position.set(Math.random()*100-50,1.5,Math.random()*100-50);
 scene.add(t);
}

// машины
let cars=[];
for(let i=0;i<6;i++){
 let car=new THREE.Mesh(
  new THREE.BoxGeometry(2,1,1),
  new THREE.MeshStandardMaterial({color:0xff0000})
 );
 car.position.set(Math.random()*100-50,0.5,Math.random()*100-50);
 scene.add(car);
 cars.push(car);
}

let inCar=false;

// пули
let bullets=[];
let money=0;

// джойстик
let joy={x:0,y:0};
const stick=document.getElementById("stick");

document.getElementById("joy").addEventListener("touchmove",e=>{
 let t=e.touches[0];
 let r=e.target.getBoundingClientRect();
 let dx=t.clientX-(r.left+50);
 let dy=t.clientY-(r.top+50);
 joy.x=dx/50;
 joy.y=dy/50;
 stick.style.left=(30+dx/2)+"px";
 stick.style.top=(30+dy/2)+"px";
});

document.addEventListener("touchend",()=>{
 joy.x=0;joy.y=0;
 stick.style.left="30px";
 stick.style.top="30px";
});

// стрельба
document.getElementById("shoot").onclick=()=>{
 bullets.push({
  x:player.position.x,
  z:player.position.z,
  dx:joy.x*0.5,
  dz:joy.y*0.5
 });
};

// войти в машину
document.addEventListener("dblclick",()=>{
 cars.forEach(car=>{
  if(player.position.distanceTo(car.position)<3){
   inCar=!inCar;
  }
 });
});

// движение
function move(){
 let speed=inCar?0.5:0.2;

 if(inCar){
  cars[0].position.x+=joy.x*speed;
  cars[0].position.z+=joy.y*speed;
  player.position.copy(cars[0].position);
 }else{
  player.position.x+=joy.x*speed;
  player.position.z+=joy.y*speed;

  // анимация ног
  leg1.rotation.x+=joy.y*0.1;
  leg2.rotation.x-=joy.y*0.1;
 }
}

// пули
function updateBullets(){
 bullets.forEach(b=>{
  b.x+=b.dx;
  b.z+=b.dz;
 });

 bullets.forEach(b=>{
  cars.forEach(c=>{
   if(Math.abs(b.x-c.position.x)<1 &&
      Math.abs(b.z-c.position.z)<1){
    money+=10;
   }
  });
 });
}

// камера
function cam(){
 camera.position.x=player.position.x;
 camera.position.z=player.position.z+5;
 camera.position.y=3;
 camera.lookAt(player.position);
}

// машины двигаются
function updateCars(){
 cars.forEach(c=>{
  c.position.x+=0.05;
  if(c.position.x>50) c.position.x=-50;
 });
}

// цикл
function loop(){
 requestAnimationFrame(loop);
 move();
 cam();
 updateCars();
 updateBullets();
 document.getElementById("money").innerText="💰 "+money;
 renderer.render(scene,camera);
}

loop();
</script>

</body>
</html>
