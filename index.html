<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Ultra Tycoon</title>

<style>
body{margin:0;overflow:hidden;font-family:Arial;}
#ui{
 position:absolute;top:0;width:100%;
 background:#111;color:white;padding:8px;
}
#joy{
 position:absolute;bottom:20px;left:20px;
 width:100px;height:100px;
 background:rgba(255,255,255,0.3);
 border-radius:50%;
}
#stick{
 width:40px;height:40px;
 background:white;border-radius:50%;
 position:absolute;left:30px;top:30px;
}
#build,#upgrade,#shop{
 position:absolute;right:20px;
 padding:10px;font-size:16px;
}
#build{bottom:20px;}
#upgrade{bottom:70px;}
#shop{bottom:120px;}
</style>
</head>

<body>

<div id="ui">
💰 <span id="money">100</span> |
🏠 <span id="count">0</span>
</div>

<div id="joy"><div id="stick"></div></div>

<button id="build">🏠 Построить</button>
<button id="upgrade">⬆️ Улучшить</button>
<button id="shop">💰 Бонус</button>

<canvas id="game"></canvas>

<script>
const c=document.getElementById("game");
const ctx=c.getContext("2d");

c.width=innerWidth;
c.height=innerHeight;

let player={x:1000,y:1000};
let money=Number(localStorage.getItem("money"))||100;
let houses=JSON.parse(localStorage.getItem("houses"))||[];
let trees=[];

for(let i=0;i<60;i++){
 trees.push({x:Math.random()*4000,y:Math.random()*4000});
}

// джойстик
let joy={x:0,y:0};
const stick=document.getElementById("stick");

document.getElementById("joy").addEventListener("touchmove",e=>{
 let t=e.touches[0];
 let r=e.target.getBoundingClientRect();
 let dx=t.clientX-(r.left+50);
 let dy=t.clientY-(r.top+50);
 joy.x=dx/50;
 joy.y=dy/50;
 stick.style.left=(30+dx/2)+"px";
 stick.style.top=(30+dy/2)+"px";
});

document.addEventListener("touchend",()=>{
 joy.x=0;joy.y=0;
 stick.style.left="30px";
 stick.style.top="30px";
});

// движение
function move(){
 player.x+=joy.x*4;
 player.y+=joy.y*4;
}

// построить дом
build.onclick=()=>{
 if(money>=50){
  houses.push({x:player.x,y:player.y,level:1});
  money-=50;
 }
};

// улучшить дом
upgrade.onclick=()=>{
 houses.forEach(h=>{
  let dx=h.x-player.x;
  let dy=h.y-player.y;
  if(Math.hypot(dx,dy)<50 && money>=30){
   h.level++;
   money-=30;
  }
 });
};

// бонус
shop.onclick=()=>{
 money+=100;
};

// доход
setInterval(()=>{
 houses.forEach(h=>{
  money+=h.level*3;
 });
},2000);

// сохранение
setInterval(()=>{
 localStorage.setItem("money",money);
 localStorage.setItem("houses",JSON.stringify(houses));
},2000);

// камера
function cam(){
 return {x:player.x-c.width/2,y:player.y-c.height/2};
}

// рисование
function draw(){
 ctx.clearRect(0,0,c.width,c.height);
 let m=cam();

 // земля
 for(let x=0;x<c.width;x+=40){
  for(let y=0;y<c.height;y+=40){
   ctx.fillStyle=(x+y)%80==0?"#6fdc3c":"#62c932";
   ctx.fillRect(x,y,40,40);
  }
 }

 // деревья
 trees.forEach(t=>{
  ctx.fillStyle="green";
  ctx.beginPath();
  ctx.arc(t.x-m.x,t.y-m.y,15,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle="brown";
  ctx.fillRect(t.x-5-m.x,t.y-m.y,10,20);
 });

 // дома
 houses.forEach(h=>{
  ctx.fillStyle=h.level>2?"gold":"brown";
  ctx.fillRect(h.x-20-m.x,h.y-20-m.y,40,40);

  ctx.fillStyle="red";
  ctx.beginPath();
  ctx.moveTo(h.x-25-m.x,h.y-20-m.y);
  ctx.lineTo(h.x+25-m.x,h.y-20-m.y);
  ctx.lineTo(h.x-m.x,h.y-40-m.y);
  ctx.fill();
 });

 // игрок
 let px=player.x-m.x;
 let py=player.y-m.y;

 ctx.fillStyle="black";
 ctx.fillRect(px-5,py+10,5,10);
 ctx.fillRect(px,py+10,5,10);

 ctx.fillStyle="blue";
 ctx.fillRect(px-10,py-10,20,20);

 ctx.fillStyle="peachpuff";
 ctx.beginPath();
 ctx.arc(px,py-20,8,0,Math.PI*2);
 ctx.fill();

 // UI
 moneySpan.innerText=Math.floor(money);
 count.innerText=houses.length;
}

function loop(){
 move();
 draw();
 requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
