<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>3D Builder PRO</title>
<style>
body { margin:0; overflow:hidden; }
#ui{
 position:absolute;
 top:10px;
 left:10px;
 color:white;
 background:rgba(0,0,0,0.5);
 padding:10px;
 font-family:Arial;
}
</style>
</head>

<body>

<div id="ui">
🎮 Кликни по экрану<br>
WASD — ходить<br>
Мышка — смотреть<br>
ЛКМ — строить<br>
ПКМ — ломать
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.158/build/three.module.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// свет
const light = new THREE.DirectionalLight(0xffffff,1);
light.position.set(5,10,5);
scene.add(light);

// земля
const ground = new THREE.Mesh(
 new THREE.PlaneGeometry(100,100),
 new THREE.MeshLambertMaterial({color:0x55aa55})
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

// ===== ПЕРСОНАЖ (тело + голова) =====
const body = new THREE.Mesh(
 new THREE.BoxGeometry(0.8,1.2,0.4),
 new THREE.MeshLambertMaterial({color:0x0000ff})
);

const head = new THREE.Mesh(
 new THREE.SphereGeometry(0.3),
 new THREE.MeshLambertMaterial({color:0xffccaa})
);

head.position.y = 1;

const player = new THREE.Group();
player.add(body);
player.add(head);

scene.add(player);

camera.position.set(0,2,5);

// блоки
const blocks = [];
const cubeGeo = new THREE.BoxGeometry(1,1,1);
const cubeMat = new THREE.MeshLambertMaterial({color:0x8B4513});

// управление
let keys = {};
document.addEventListener("keydown", e=>keys[e.key]=true);
document.addEventListener("keyup", e=>keys[e.key]=false);

// мышка
document.body.onclick = ()=>document.body.requestPointerLock();

let yaw = 0;
let pitch = 0;

document.addEventListener("mousemove", e=>{
 if(document.pointerLockElement){
  yaw -= e.movementX * 0.002;
  pitch -= e.movementY * 0.002;
  pitch = Math.max(-1.5, Math.min(1.5, pitch));
 }
});

// луч
const raycaster = new THREE.Raycaster();

// строительство
document.addEventListener("mousedown", e=>{
 raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
 const hit = raycaster.intersectObjects([ground,...blocks]);

 if(hit.length > 0){
  const h = hit[0];

  if(e.button === 0){
   const cube = new THREE.Mesh(cubeGeo, cubeMat);
   cube.position.copy(h.point).add(h.face.normal).floor().addScalar(0.5);
   scene.add(cube);
   blocks.push(cube);
  }

  if(e.button === 2){
   if(h.object !== ground){
    scene.remove(h.object);
    blocks.splice(blocks.indexOf(h.object),1);
   }
  }
 }
});

window.addEventListener("contextmenu", e=>e.preventDefault());

// движение
function move(){
 let speed = 0.1;

 let forward = new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw));
 let right = new THREE.Vector3().crossVectors(forward,new THREE.Vector3(0,1,0));

 if(keys["w"]) player.position.add(forward.clone().multiplyScalar(-speed));
 if(keys["s"]) player.position.add(forward.clone().multiplyScalar(speed));
 if(keys["a"]) player.position.add(right.clone().multiplyScalar(-speed));
 if(keys["d"]) player.position.add(right.clone().multiplyScalar(speed));

 // камера следует за игроком
 camera.position.x = player.position.x;
 camera.position.z = player.position.z;

 camera.rotation.order = "YXZ";
 camera.rotation.y = yaw;
 camera.rotation.x = pitch;
}

// цикл
function animate(){
 requestAnimationFrame(animate);
 move();
 renderer.render(scene, camera);
}
animate();
</script>

</body>
</html>
