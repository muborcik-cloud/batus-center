<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>3D City Game</title>
<style>
body { margin:0; overflow:hidden; }
#info{
 position:absolute;
 top:10px; left:10px;
 color:white;
 background:rgba(0,0,0,0.5);
 padding:10px;
}
</style>
</head>

<body>

<div id="info">WASD или касание для движения</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158/build/three.min.js"></script>

<script>
// сцена
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

// камера
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);

// рендер
const renderer = new THREE.WebGLRenderer();
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// свет
const light = new THREE.DirectionalLight(0xffffff,1);
light.position.set(10,20,10);
scene.add(light);

// земля
const ground = new THREE.Mesh(
 new THREE.PlaneGeometry(200,200),
 new THREE.MeshStandardMaterial({color:0x55aa55})
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

// игрок
const player = new THREE.Mesh(
 new THREE.BoxGeometry(1,2,1),
 new THREE.MeshStandardMaterial({color:0x0000ff})
);
player.position.y = 1;
scene.add(player);

// город (башни)
for(let i=0;i<80;i++){
 let h = Math.random()*15+5;

 let b = new THREE.Mesh(
  new THREE.BoxGeometry(2,h,2),
  new THREE.MeshStandardMaterial({color:0x888888})
 );

 b.position.set(
  Math.random()*150-75,
  h/2,
  Math.random()*150-75
 );

 scene.add(b);
}

// дороги
for(let i=0;i<10;i++){
 let road = new THREE.Mesh(
  new THREE.BoxGeometry(200,0.1,3),
  new THREE.MeshStandardMaterial({color:0x333333})
 );
 road.position.set(0,0.05,i*20-100);
 scene.add(road);

 let road2 = road.clone();
 road2.rotation.y = Math.PI/2;
 road2.position.set(i*20-100,0.05,0);
 scene.add(road2);
}

// деревья
for(let i=0;i<40;i++){
 let tree = new THREE.Mesh(
  new THREE.ConeGeometry(1,3,8),
  new THREE.MeshStandardMaterial({color:0x228B22})
 );
 tree.position.set(
  Math.random()*150-75,
  1.5,
  Math.random()*150-75
 );
 scene.add(tree);
}

// машины
let cars=[];
for(let i=0;i<10;i++){
 let car = new THREE.Mesh(
  new THREE.BoxGeometry(2,1,1),
  new THREE.MeshStandardMaterial({color:0xff0000})
 );
 car.position.set(Math.random()*150-75,0.5,Math.random()*150-75);
 scene.add(car);
 cars.push(car);
}

// управление
let keys={};
document.addEventListener("keydown",e=>keys[e.key]=true);
document.addEventListener("keyup",e=>keys[e.key]=false);

// движение
function move(){
 if(keys["w"]) player.position.z-=0.3;
 if(keys["s"]) player.position.z+=0.3;
 if(keys["a"]) player.position.x-=0.3;
 if(keys["d"]) player.position.x+=0.3;
}

// камера
function updateCamera(){
 camera.position.x = player.position.x;
 camera.position.z = player.position.z + 6;
 camera.position.y = player.position.y + 4;
 camera.lookAt(player.position);
}

// машины двигаются
function updateCars(){
 cars.forEach(c=>{
  c.position.x+=0.2;
  if(c.position.x>80) c.position.x=-80;
 });
}

// цикл
function animate(){
 requestAnimationFrame(animate);
 move();
 updateCamera();
 updateCars();
 renderer.render(scene,camera);
}

animate();
</script>

</body>
</html>
