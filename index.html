<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>City Game</title>

<style>
body{margin:0;overflow:hidden;font-family:Arial;}
#ui{position:absolute;top:0;width:100%;background:#111;color:white;padding:8px;}
#joy{position:absolute;bottom:20px;left:20px;width:100px;height:100px;background:rgba(255,255,255,0.3);border-radius:50%;}
#stick{width:40px;height:40px;background:white;border-radius:50%;position:absolute;left:30px;top:30px;}
button{position:absolute;right:20px;padding:10px;}
#carBtn{bottom:120px;}
#build{bottom:20px;}
</style>
</head>

<body>

<div id="ui">💰 <span id="money">100</span></div>

<div id="joy"><div id="stick"></div></div>
<button id="build">🏠 Дом</button>
<button id="carBtn">🚗 Машина</button>

<canvas id="game"></canvas>

<script>
const c=document.getElementById("game");
const ctx=c.getContext("2d");
c.width=innerWidth;
c.height=innerHeight;

let player={x:1000,y:1000,inCar:false};
let car=null;
let houses=[];
let money=100;

// дороги
let roads=[];
for(let i=0;i<20;i++){
 roads.push({x:i*200,y:0,w:40,h:4000});
 roads.push({x:0,y:i*200,w:4000,h:40});
}

// джойстик
let joy={x:0,y:0};
const stick=document.getElementById("stick");

document.getElementById("joy").addEventListener("touchmove",e=>{
 let t=e.touches[0];
 let r=e.target.getBoundingClientRect();
 let dx=t.clientX-(r.left+50);
 let dy=t.clientY-(r.top+50);
 joy.x=dx/50;
 joy.y=dy/50;
 stick.style.left=(30+dx/2)+"px";
 stick.style.top=(30+dy/2)+"px";
});

document.addEventListener("touchend",()=>{
 joy.x=0;joy.y=0;
 stick.style.left="30px";
 stick.style.top="30px";
});

// движение
function move(){
 if(player.inCar && car){
  car.x+=joy.x*6;
  car.y+=joy.y*6;
 }else{
  player.x+=joy.x*4;
  player.y+=joy.y*4;
 }
}

// построить дом
build.onclick=()=>{
 if(money>=50){
  houses.push({x:player.x,y:player.y});
  money-=50;
 }
};

// создать машину
carBtn.onclick=()=>{
 if(!car && money>=100){
  car={x:player.x,y:player.y};
  money-=100;
 }
};

// вход/выход из машины
document.addEventListener("click",()=>{
 if(car){
  let dx=car.x-player.x;
  let dy=car.y-player.y;
  if(Math.hypot(dx,dy)<50){
   player.inCar=!player.inCar;
  }
 }
});

// доход
setInterval(()=>{
 money+=houses.length*5;
},2000);

// камера
function cam(){
 if(player.inCar && car){
  return {x:car.x-c.width/2,y:car.y-c.height/2};
 }
 return {x:player.x-c.width/2,y:player.y-c.height/2};
}

// рисование
function draw(){
 ctx.clearRect(0,0,c.width,c.height);
 let m=cam();

 // трава
 ctx.fillStyle="#6fdc3c";
 ctx.fillRect(0,0,c.width,c.height);

 // дороги
 ctx.fillStyle="gray";
 roads.forEach(r=>{
  ctx.fillRect(r.x-m.x,r.y-m.y,r.w,r.h);
 });

 // дома
 houses.forEach(h=>{
  ctx.fillStyle="brown";
  ctx.fillRect(h.x-20-m.x,h.y-20-m.y,40,40);
 });

 // машина
 if(car){
  ctx.fillStyle="red";
  ctx.fillRect(car.x-15-m.x,car.y-10-m.y,30,20);
 }

 // игрок
 if(!player.inCar){
  let px=player.x-m.x;
  let py=player.y-m.y;

  ctx.fillStyle="blue";
  ctx.fillRect(px-10,py-10,20,20);

  ctx.fillStyle="peachpuff";
  ctx.beginPath();
  ctx.arc(px,py-20,8,0,Math.PI*2);
  ctx.fill();
 }

 moneySpan.innerText=Math.floor(money);
}

// цикл
function loop(){
 move();
 draw();
 requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
