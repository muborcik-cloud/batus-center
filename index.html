<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Батутный центр Душанбе — №1</title>
<meta name="description" content="Профессиональный батутный центр в Душанбе. Безопасно, красиво, весело.">

<style>
:root{
 --gold:#f5c542;
 --dark:#0b0b0b;
 --gray:#bdbdbd;
}

*{margin:0;padding:0;box-sizing:border-box}
body{
 font-family:Inter,Arial,sans-serif;
 background:#050505;
 color:white;
 line-height:1.6;
}

/* ===== HERO ===== */
.hero{
 position:relative;
 height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
}
.hero video{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 object-fit:cover;
 filter:brightness(.35);
}
.hero-content{
 position:relative;
 z-index:2;
 max-width:900px;
 padding:20px;
}
.hero h1{
 font-size:clamp(28px,4vw,44px);
 color:var(--gold);
 margin-bottom:12px;
}
.hero p{
 font-size:clamp(15px,2vw,18px);
 color:#e0e0e0;
}

/* ===== BUTTONS ===== */
.actions{
 margin-top:25px;
 display:flex;
 flex-wrap:wrap;
 gap:12px;
 justify-content:center;
}
.btn{
 padding:14px 24px;
 border-radius:10px;
 font-weight:600;
 font-size:15px;
 text-decoration:none;
}
.call{background:var(--gold);color:black}
.wa{background:#25D366;color:black}
.route{border:1px solid var(--gold);color:var(--gold)}

/* ===== SECTIONS ===== */
section{
 padding:80px 20px;
 max-width:1200px;
 margin:auto;
}
h2{
 text-align:center;
 font-size:clamp(24px,3vw,34px);
 color:var(--gold);
 margin-bottom:25px;
}
.desc{
 text-align:center;
 color:var(--gray);
 max-width:700px;
 margin:0 auto 40px;
 font-size:16px;
}

/* ===== CARDS ===== */
.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
 gap:25px;
}
.card{
 background:#101010;
 padding:30px;
 border-radius:18px;
 border:1px solid #222;
 transition:.3s;
}
.card:hover{
 transform:translateY(-6px);
 border-color:var(--gold);
}
.card h3{color:var(--gold);margin-bottom:10px}

/* ===== GALLERY ===== */
.gallery{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
 gap:15px;
}
.gallery img{
 width:100%;
 border-radius:16px;
 object-fit:cover;
 height:200px;
}

/* ===== PRICES ===== */
.price{
 font-size:28px;
 font-weight:700;
 margin-top:10px;
}

/* ===== FORM ===== */
form{
 max-width:500px;
 margin:0 auto;
 display:grid;
 gap:15px;
}
input,button{
 padding:14px;
 border-radius:10px;
 border:none;
 font-size:15px;
}
input{background:#1a1a1a;color:white}
button{
 background:var(--gold);
 font-weight:700;
 cursor:pointer;
}

/* ===== MAP ===== */
iframe{
 width:100%;
 height:360px;
 border-radius:18px;
 border:none;
}

/* ===== FOOTER ===== */
footer{
 padding:30px;
 text-align:center;
 font-size:14px;
 color:#888;
}

/* ===== LANG ===== */
.lang{
 position:fixed;
 top:15px;
 right:15px;
 z-index:10;
}
.lang button{
 background:#141414;
 color:white;
 border:1px solid #333;
 padding:6px 10px;
 border-radius:6px;
 cursor:pointer;
 margin-left:5px;
}
</style>

<script>
function setLang(l){
 document.querySelectorAll("[data-ru]").forEach(e=>{
   e.innerText = l==="ru"?e.dataset.ru:e.dataset.en;
 });
}
</script>
</head>

<body onload="setLang('ru')">

<div class="lang">
 <button onclick="setLang('ru')">RU</button>
 <button onclick="setLang('en')">EN</button>
</div>

<!-- HERO -->
<div class="hero">
 <video autoplay muted loop>
  <source src="https://cdn.coverr.co/videos/coverr-kids-playing-4260/1080p.mp4">
 </video>
 <div class="hero-content">
  <h1 data-ru="Батутный центр №1 в Душанбе"
      data-en="Trampoline Center #1 in Dushanbe"></h1>
  <p data-ru="Безопасные батуты • Радость детям • Спокойствие родителям"
     data-en="Safe trampolines • Happy kids • Calm parents"></p>

  <div class="actions">
   <a href="tel:+992011900303" class="btn call">Позвонить</a>
   <a href="https://wa.me/992011900303" class="btn wa">WhatsApp</a>
   <a href="#map" class="btn route">Маршрут</a>
  </div>
 </div>
</div>

<!-- WHY -->
<section>
 <h2 data-ru="Почему мы" data-en="Why us"></h2>
 <p class="desc" data-ru="Профессиональный батутный центр только в Душанбе"
    data-en="Professional trampoline center only in Dushanbe"></p>
 <div class="grid">
  <div class="card"><h3>Безопасность</h3><p>Контроль, мягкие зоны, правила</p></div>
  <div class="card"><h3>Чистота</h3><p>Ежедневная уборка и уход</p></div>
  <div class="card"><h3>Опыт</h3><p>Дети счастливы, родители довольны</p></div>
 </div>
</section>

<!-- GALLERY -->
<section>
 <h2 data-ru="Галерея" data-en="Gallery"></h2>
 <div class="gallery">
  <img src="https://images.unsplash.com/photo-1600607687644-c7171b42498b">
  <img src="https://images.unsplash.com/photo-1581578731548-c64695cc6952">
  <img src="https://images.unsplash.com/photo-1604881988758-f76ad2f7aac1">
 </div>
</section>

<!-- PRICES -->
<section>
 <h2 data-ru="Цены" data-en="Prices"></h2>
 <div class="grid">
  <div class="card"><h3>1 час</h3><div class="price">100 сомони</div></div>
  <div class="card"><h3>2 часа</h3><div class="price">200 сомони</div></div>
  <div class="card"><h3>Безлимит</h3><div class="price">400 сомони</div></div>
 </div>
</section>

<!-- FORM -->
<section>
 <h2 data-ru="Отправить заявку" data-en="Send request"></h2>
 <form>
  <input placeholder="Ваше имя">
  <input placeholder="Телефон">
  <button>Отправить</button>
 </form>
</section>

<!-- MAP -->
<section id="map">
 <h2 data-ru="Как нас найти" data-en="How to find us"></h2>
 <iframe src="https://maps.google.com/maps?q=Dushanbe&z=13&output=embed"></iframe>
</section>

<footer>
 © 2025 Батутный центр Душанбе • Премиум уровень
</footer>

</body>
    </html>
