<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Ultra Game</title>
<style>
body{margin:0;overflow:hidden;font-family:sans-serif;}
canvas{display:block;background:#6bdc6b;}
#ui{position:fixed;top:10px;left:10px;background:rgba(0,0,0,0.6);color:white;padding:10px;}
#buttons{position:fixed;bottom:10px;right:10px;}
button{margin:4px;padding:8px;}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="ui">
💰 <span id="money">0</span><br>
📈 <span id="income">50</span>/сек
</div>

<div id="buttons">
<button onclick="mode='house'">🏠 Дом</button>
<button onclick="mode='shop'">🏪 Магазин</button>
<button onclick="mode='hotel'">🏨 Отель</button>
<button onclick="mode='car'">🚗 Машина</button>
<button onclick="upgrade()">⬆️ Улучшить</button>
</div>

<script>
const c=document.getElementById("game");
const ctx=c.getContext("2d");
c.width=innerWidth;
c.height=innerHeight;

// ===== ДАННЫЕ =====
let money=100;
let income=50;
let mode=null;

let buildings=[];
let cars=[];
let npcs=[];

// NPC люди
for(let i=0;i<10;i++){
 npcs.push({x:Math.random()*1000,y:Math.random()*1000,dir:Math.random()*6});
}

// игрок
let player={x:0,y:0,speed:4};

// управление
let keys={};
addEventListener("keydown",e=>keys[e.key]=true);
addEventListener("keyup",e=>keys[e.key]=false);

// деньги
setInterval(()=>{money+=income;},1000);

// клик (строительство)
c.addEventListener("click",e=>{
 let x=player.x+(e.clientX-c.width/2);
 let y=player.y+(e.clientY-c.height/2);

 if(mode==="house"&&money>=50){
  money-=50;
  buildings.push({x,y,type:"house"});
 }
 if(mode==="shop"&&money>=80){
  money-=80;
  buildings.push({x,y,type:"shop"});
 }
 if(mode==="hotel"&&money>=150){
  money-=150;
  buildings.push({x,y,type:"hotel"});
 }
 if(mode==="car"&&money>=60){
  money-=60;
  cars.push({x,y,dir:Math.random()*6});
 }
});

// улучшение
function upgrade(){
 if(money>=100){
  money-=100;
  income+=20;
 }
}

// движение
function update(){
 if(keys["w"])player.y-=player.speed;
 if(keys["s"])player.y+=player.speed;
 if(keys["a"])player.x-=player.speed;
 if(keys["d"])player.x+=player.speed;

 cars.forEach(c=>{
  c.x+=Math.cos(c.dir)*2;
  c.y+=Math.sin(c.dir)*2;
 });

 npcs.forEach(n=>{
  n.x+=Math.cos(n.dir);
  n.y+=Math.sin(n.dir);
 });
}

// рисование человека
function drawHuman(x,y){
 // ноги
 ctx.fillStyle="black";
 ctx.fillRect(x-5,y+10,4,10);
 ctx.fillRect(x+1,y+10,4,10);

 // тело
 ctx.fillStyle="blue";
 ctx.fillRect(x-8,y-5,16,20);

 // руки
 ctx.fillRect(x-12,y,6,4);
 ctx.fillRect(x+6,y,6,4);

 // голова
 ctx.fillStyle="#f5c6a5";
 ctx.beginPath();
 ctx.arc(x,y-12,8,0,Math.PI*2);
 ctx.fill();
}

// рендер
function draw(){
 ctx.clearRect(0,0,c.width,c.height);

 let camX=player.x-c.width/2;
 let camY=player.y-c.height/2;

 // дороги
 ctx.fillStyle="#777";
 for(let x=-2000;x<2000;x+=200){
  ctx.fillRect(x-camX,-2000-camY,40,4000);
 }
 for(let y=-2000;y<2000;y+=200){
  ctx.fillRect(-2000-camX,y-camY,4000,40);
 }

 // светофоры
 ctx.fillStyle="black";
 for(let x=-2000;x<2000;x+=200){
  for(let y=-2000;y<2000;y+=200){
   ctx.fillRect(x-camX,y-camY,10,20);
   ctx.fillStyle="red";
   ctx.fillRect(x-camX+2,y-camY+2,6,6);
   ctx.fillStyle="black";
  }
 }

 // здания
 buildings.forEach(b=>{
  if(b.type==="house")ctx.fillStyle="red";
  if(b.type==="shop")ctx.fillStyle="blue";
  if(b.type==="hotel")ctx.fillStyle="purple";
  ctx.fillRect(b.x-camX,b.y-camY,30,30);
 });

 // машины
 cars.forEach(car=>{
  ctx.fillStyle="black";
  ctx.fillRect(car.x-camX,car.y-camY,20,10);
 });

 // NPC
 npcs.forEach(n=>{
  drawHuman(n.x-camX,n.y-camY);
 });

 // игрок
 drawHuman(c.width/2,c.height/2);

 // UI
 moneySpan.innerText=Math.floor(money);
 incomeSpan.innerText=income;
}

// цикл
function loop(){
 update();
 draw();
 requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
