<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>3D City PRO</title>
<style>
body{margin:0;overflow:hidden;}
#ui{
 position:fixed;top:10px;left:10px;
 color:white;background:#0008;padding:10px;
}
</style>
</head>
<body>

<div id="ui">💰 <span id="money">0</span></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.158/examples/js/loaders/GLTFLoader.js"></script>

<script>
let scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);

let camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);
let renderer=new THREE.WebGLRenderer();
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

// свет
let light=new THREE.DirectionalLight(0xffffff,1);
light.position.set(5,10,5);
scene.add(light);

// земля
let ground=new THREE.Mesh(
 new THREE.PlaneGeometry(200,200),
 new THREE.MeshStandardMaterial({color:0x55aa55})
);
ground.rotation.x=-Math.PI/2;
scene.add(ground);

// загрузчик моделей
let loader=new THREE.GLTFLoader();

// 🧍 игрок (модель)
let player;
loader.load(
 "https://threejs.org/examples/models/gltf/RobotExpressive/RobotExpressive.glb",
 gltf=>{
  player=gltf.scene;
  player.scale.set(0.5,0.5,0.5);
  scene.add(player);
 }
);

// 🚗 машина
let car;
loader.load(
 "https://threejs.org/examples/models/gltf/Flamingo.glb",
 gltf=>{
  car=gltf.scene;
  car.scale.set(0.02,0.02,0.02);
  car.position.set(5,0,5);
  scene.add(car);
 }
);

// 🏢 здания
function createBuilding(x,z){
 let b=new THREE.Mesh(
  new THREE.BoxGeometry(2,Math.random()*5+2,2),
  new THREE.MeshStandardMaterial({color:0x888888})
 );
 b.position.set(x,b.geometry.parameters.height/2,z);
 scene.add(b);
}

// город
for(let i=-10;i<10;i++){
 for(let j=-10;j<10;j++){
  if(Math.random()>0.6){
   createBuilding(i*4,j*4);
  }
 }
}

// деньги
let money=0;
setInterval(()=>{
 money+=10;
 document.getElementById("money").innerText=money;
},1000);

// управление
let keys={};
document.addEventListener("keydown",e=>keys[e.key]=true);
document.addEventListener("keyup",e=>keys[e.key]=false);

camera.position.set(0,3,8);

function update(){
 if(!player) return;

 let speed=0.1;

 if(keys["w"]) player.position.z-=speed;
 if(keys["s"]) player.position.z+=speed;
 if(keys["a"]) player.position.x-=speed;
 if(keys["d"]) player.position.x+=speed;

 camera.position.x=player.position.x;
 camera.position.z=player.position.z+8;
 camera.lookAt(player.position);
}

// цикл
function loop(){
 requestAnimationFrame(loop);
 update();
 renderer.render(scene,camera);
}
loop();
</script>

</body>
</html>
