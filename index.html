<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Батутный центр Душанбе</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Montserrat;background:#0b1220;color:#fff}
section{padding:80px 20px;max-width:1200px;margin:auto}
h1,h2{text-align:center;margin-bottom:20px}
p{text-align:center;opacity:.9}

.lang{
position:fixed;
top:20px;
right:20px;
background:#020617;
padding:8px 15px;
border-radius:30px;
cursor:pointer;
font-weight:600
}

.hero{
min-height:100vh;
background:linear-gradient(120deg,#ff0080,#7928ca);
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:20px
}

.hero h1{font-size:3rem;font-weight:800}
.btns{display:flex;gap:15px;justify-content:center;flex-wrap:wrap;margin-top:25px}

.btn{
padding:15px 30px;
border-radius:50px;
font-weight:600;
text-decoration:none;
transition:.3s
}
.whatsapp{background:#25d366;color:#000}
.call{background:#fff;color:#000}
.btn:hover{transform:scale(1.05)}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:30px
}

.card{
background:#111827;
padding:30px;
border-radius:20px;
box-shadow:0 20px 40px rgba(0,0,0,.4)
}

.price{
font-size:2rem;
font-weight:800;
color:#38bdf8;
margin:15px 0
}

footer{
background:#020617;
padding:40px 20px;
text-align:center
}
</style>
</head>

<body>

<div class="lang" onclick="toggleLang()">RU / EN</div>

<!-- HERO -->
<div class="hero">
<div>
<h1 id="title">Батутный центр в Душанбе</h1>
<p id="desc">Современный трёхэтажный центр для детей и взрослых. Безопасно. Ярко. Весело.</p>

<div class="btns">
<a class="btn whatsapp" href="https://wa.me/992011900303" target="_blank" id="wa">Написать в WhatsApp</a>
<a class="btn call" href="tel:+992011900303" id="call">Позвонить</a>
</div>
</div>
</div>

<!-- ЦЕНЫ -->
<section>
<h2 id="prices">Цены</h2>
<div class="grid">

<div class="card">
<h3 id="p1">Стандарт</h3>
<div class="price">100 сомони</div>
</div>

<div class="card">
<h3 id="p2">Праздник</h3>
<div class="price">200 сомони</div>
</div>

<div class="card">
<h3 id="p3">Премиум</h3>
<div class="price">400 сомони</div>
</div>

</div>
</section>

<footer>
<p id="footer">
Мубориз<br>
📞 +992 011 900 303<br>
Батутный центр, Душанбе
</p>
</footer>

<script>
let ru=true;
function toggleLang(){
ru=!ru;

document.getElementById("title").innerText =
ru ? "Батутный центр в Душанбе" : "Trampoline Center in Dushanbe";

document.getElementById("desc").innerText =
ru ? "Современный трёхэтажный центр для детей и взрослых. Безопасно. Ярко. Весело."
   : "Modern three-floor trampoline center for kids and adults. Safe. Fun. Bright.";

document.getElementById("prices").innerText = ru ? "Цены" : "Prices";

document.getElementById("p1").innerText = ru ? "Стандарт" : "Standard";
document.getElementById("p2").innerText = ru ? "Праздник" : "Party";
document.getElementById("p3").innerText = ru ? "Премиум" : "Premium";

document.getElementById("wa").innerText =
ru ? "Написать в WhatsApp" : "Write on WhatsApp";

document.getElementById("call").innerText =
ru ? "Позвонить" : "Call";

document.getElementById("footer").innerHTML =
ru ? "Мубориз<br>📞 +992 011 900 303<br>Батутный центр, Душанбе"
   : "Muboriz<br>📞 +992 011 900 303<br>Trampoline Center, Dushanbe";
}
</script>

</body>
</html>
