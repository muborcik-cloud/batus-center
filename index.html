<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Roblox Style Tycoon</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}

#top{
  background:#1e293b;
  padding:15px;
  font-size:20px;
}

#click{
  background:red;
  border:none;
  padding:20px;
  font-size:20px;
  border-radius:10px;
  margin:15px;
  cursor:pointer;
}

#shop{
  margin-top:10px;
}

button{
  padding:10px;
  margin:5px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

#map{
  margin-top:20px;
}

.house{
  display:inline-block;
  width:50px;
  height:50px;
  margin:5px;
  background:brown;
}

.l2{ background:orange; }
.l3{ background:gold; }

.bot{
  display:inline-block;
  margin:5px;
  padding:5px;
  background:#334155;
  border-radius:6px;
}
</style>
</head>

<body>

<div id="top">
💰 Деньги: <span id="money">0</span> |
⚡ Доход: <span id="income">0</span>/сек
</div>

<button id="click">🔴 КЛИК</button>

<div id="shop">
<h3>🏠 Строительство</h3>
<button onclick="buyHouse()">Дом (50)</button>
<button onclick="upgrade()">Улучшить (100)</button>

<h3>🤖 Игроки (боты)</h3>
<button onclick="buyBot()">Нанять (200)</button>
</div>

<div id="map"></div>
<div id="bots"></div>

<script>
let money = 0;
let houses = [];
let income = 0;
let bots = [];

// клик
click.onclick = ()=>{
  money += 1;
  update();
};

// купить дом
function buyHouse(){
  if(money >= 50){
    money -= 50;
    houses.push(1);
    income += 1;
    render();
  }
}

// апгрейд
function upgrade(){
  if(money >= 100){
    for(let i=0;i<houses.length;i++){
      if(houses[i] < 3){
        houses[i]++;
        money -= 100;
        income += 2;
        break;
      }
    }
    render();
  }
}

// бот (как "игрок")
function buyBot(){
  if(money >= 200){
    money -= 200;
    bots.push({power:1});
    renderBots();
  }
}

// доход
setInterval(()=>{
  money += income;

  // боты кликают
  bots.forEach(b=>{
    money += b.power;
  });

  update();
},1000);

// UI
function update(){
  moneyEl.innerText = money;
  incomeEl.innerText = income;
}

const moneyEl = document.getElementById("money");
const incomeEl = document.getElementById("income");

// дома
function render(){
  update();
  map.innerHTML = "";

  houses.forEach(level=>{
    const h = document.createElement("div");
    h.className = "house";
    if(level===2) h.classList.add("l2");
    if(level===3) h.classList.add("l3");
    map.appendChild(h);
  });
}

// боты
function renderBots(){
  botsDiv.innerHTML = "";
  bots.forEach((b,i)=>{
    const el = document.createElement("div");
    el.className = "bot";
    el.innerText = "Игрок #" + (i+1);
    botsDiv.appendChild(el);
  });
}

const map = document.getElementById("map");
const botsDiv = document.getElementById("bots");
</script>

</body>
</html>
