<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Батутный центр Душанбе</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Montserrat',sans-serif}
body{background:#0b0e23;color:#fff;line-height:1.6}
header{
background:linear-gradient(135deg,#ff512f,#dd2476);
padding:90px 20px;text-align:center
}
header h1{font-size:3.2rem;font-weight:800}
header p{font-size:1.3rem;margin-top:15px}

.lang{
position:absolute;top:20px;right:20px
}
.lang button{
background:#fff;color:#000;border:none;
padding:8px 14px;border-radius:20px;
margin-left:5px;font-weight:600;cursor:pointer
}

nav{
background:#111;padding:15px;text-align:center;
position:sticky;top:0;z-index:100
}
nav a{
color:#fff;text-decoration:none;margin:0 12px;font-weight:600
}
nav a:hover{color:#ff4b7b}

section{padding:70px 20px;max-width:1200px;margin:auto}
h2{text-align:center;font-size:2.4rem;margin-bottom:30px}

.cards{
display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:25px
}
.card{
background:#1a1e44;padding:30px;border-radius:22px;
box-shadow:0 20px 40px rgba(0,0,0,.45)
}

.price{font-size:2.2rem;font-weight:800;color:#ff4b7b}

.gallery{
display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px
}
.gallery div{
height:180px;border-radius:20px;
background:linear-gradient(120deg,#ff4b7b,#ff9f43)
}

button{
background:#ff4b7b;border:none;
padding:15px 30px;border-radius:40px;
color:#fff;font-weight:600;cursor:pointer
}
button:hover{background:#ff255f}

input,textarea{
width:100%;padding:15px;border-radius:15px;
border:none;margin-bottom:15px
}

footer{
background:#111;padding:25px;text-align:center;
color:#aaa;font-size:.9rem
}

.hide{display:none}
</style>

<script>
function setLang(lang){
document.querySelectorAll('[data-ru]').forEach(el=>{
el.innerHTML = lang==='ru' ? el.dataset.ru : el.dataset.en
})
}
</script>
</head>

<body onload="setLang('ru')">

<div class="lang">
<button onclick="setLang('ru')">RU</button>
<button onclick="setLang('en')">EN</button>
</div>

<header>
<h1 data-ru="Батутный центр в Душанбе"
    data-en="Trampoline Center in Dushanbe"></h1>
<p data-ru="Трёхэтажный • Современный • Безопасный"
   data-en="Three floors • Modern • Safe"></p>
</header>

<nav>
<a href="#about" data-ru="О нас" data-en="About"></a>
<a href="#prices" data-ru="Цены" data-en="Prices"></a>
<a href="#gallery" data-ru="Галерея" data-en="Gallery"></a>
<a href="#reviews" data-ru="Отзывы" data-en="Reviews"></a>
<a href="#order" data-ru="Заявка" data-en="Order"></a>
<a href="#map" data-ru="Карта" data-en="Map"></a>
</nav>

<section id="about">
<h2 data-ru="О нашем центре" data-en="About our center"></h2>
<p style="max-width:850px;margin:auto;text-align:center"
data-ru="Меня зовут Мубориз. Я создал профессиональный батутный центр в Душанбе — место радости, энергии и безопасности для детей и взрослых."
data-en="My name is Muboriz. I created a professional trampoline center in Dushanbe — a place of joy, energy and safety for children and adults.">
</p>
</section>

<section>
<h2 data-ru="Что у нас есть" data-en="What we offer"></h2>
<div class="cards">
<div class="card" data-ru="🤸 Большая батутная зона" data-en="🤸 Large trampoline zone"></div>
<div class="card" data-ru="🏢 Три этажа развлечений" data-en="🏢 Three floors of fun"></div>
<div class="card" data-ru="🎉 Праздники и дни рождения" data-en="🎉 Parties & birthdays"></div>
<div class="card" data-ru="🛡 Безопасность и контроль" data-en="🛡 Safety and control"></div>
</div>
</section>

<section id="prices">
<h2 data-ru="Цены" data-en="Prices"></h2>
<div class="cards">
<div class="card"><h3>Mini</h3><div class="price">100 TJS</div></div>
<div class="card"><h3>Standard</h3><div class="price">200 TJS</div></div>
<div class="card"><h3>Premium</h3><div class="price">400 TJS</div></div>
</div>
</section>

<section id="gallery">
<h2 data-ru="Фото-галерея" data-en="Photo gallery"></h2>
<div class="gallery">
<div></div><div></div><div></div><div></div><div></div><div></div>
</div>
</section>

<section id="reviews">
<h2 data-ru="Отзывы родителей" data-en="Parents reviews"></h2>
<div class="cards">
<div class="card">★★★★★<br>Отличное место!</div>
<div class="card">★★★★★<br>Лучший центр в городе.</div>
<div class="card">★★★★★<br>Дети в восторге.</div>
</div>
</section>

<section id="order">
<h2 data-ru="Оставить заявку" data-en="Send request"></h2>
<form>
<input type="text" placeholder="Имя / Name">
<input type="tel" placeholder="Телефон / Phone">
<textarea placeholder="Сообщение / Message"></textarea>
<button type="submit" data-ru="Отправить" data-en="Send"></button>
</form>

<div style="text-align:center;margin-top:20px">
<a href="tel:+992011900303"><button>📞 Call</button></a>
<a href="https://wa.me/992011900303"><button>💬 WhatsApp</button></a>
</div>
</section>

<section id="map">
<h2 data-ru="Мы на карте" data-en="Find us on map"></h2>
<iframe src="https://www.google.com/maps?q=Душанбе&output=embed"
width="100%" height="350" style="border:0;border-radius:20px"></iframe>
<p style="text-align:center;margin-top:15px">
<a href="https://www.google.com/maps/dir/?api=1&destination=Душанбе" target="_blank">
<button data-ru="Построить маршрут" data-en="Build route"></button>
</a>
</p>
</section>

<footer>
© 2025 Batut Center Dushanbe • Ultra Professional Website
</footer>

</body>
                                                       </html>
