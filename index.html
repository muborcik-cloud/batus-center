<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>City Game</title>

<style>
body{margin:0;overflow:hidden;font-family:Arial;}

#ui{
 position:absolute;
 top:0;width:100%;
 background:#111;color:white;
 padding:10px;
}

#joy{
 position:absolute;
 bottom:20px;left:20px;
 width:100px;height:100px;
 background:rgba(255,255,255,0.3);
 border-radius:50%;
}

#stick{
 width:40px;height:40px;
 background:white;border-radius:50%;
 position:absolute;left:30px;top:30px;
}

button{
 position:absolute;
 right:20px;
 padding:10px;
}

#build{bottom:100px;}
</style>
</head>

<body>

<div id="ui">
💰 <span id="money">200</span>
</div>

<div id="joy"><div id="stick"></div></div>
<button id="build">🏠</button>

<canvas id="game"></canvas>

<script>
const c = document.getElementById("game");
const ctx = c.getContext("2d");

c.width = innerWidth;
c.height = innerHeight;

let player = {x:500,y:500};
let money = 200;

// город
let buildings = [];
let npcs = [];
let cars = [];

// создаём здания
for(let i=0;i<40;i++){
 buildings.push({
  x:Math.random()*2000,
  y:Math.random()*2000,
  w:40+Math.random()*60,
  h:40+Math.random()*100
 });
}

// NPC люди
for(let i=0;i<10;i++){
 npcs.push({
  x:Math.random()*2000,
  y:Math.random()*2000,
  dx:Math.random()*2-1,
  dy:Math.random()*2-1
 });
}

// машины
for(let i=0;i<5;i++){
 cars.push({
  x:Math.random()*2000,
  y:Math.random()*2000,
  speed:2+Math.random()*2
 });
}

// джойстик
let joy={x:0,y:0};
const stick=document.getElementById("stick");

document.getElementById("joy").addEventListener("touchmove", e=>{
 let t=e.touches[0];
 let rect=e.target.getBoundingClientRect();

 let dx=t.clientX-(rect.left+50);
 let dy=t.clientY-(rect.top+50);

 joy.x=dx/50;
 joy.y=dy/50;

 stick.style.left=(30+dx/2)+"px";
 stick.style.top=(30+dy/2)+"px";
});

document.addEventListener("touchend", ()=>{
 joy.x=0;joy.y=0;
 stick.style.left="30px";
 stick.style.top="30px";
});

// движение
function move(){
 player.x+=joy.x*4;
 player.y+=joy.y*4;
}

// камера
function cam(){
 return {x:player.x-c.width/2,y:player.y-c.height/2};
}

// NPC движение
function updateNPC(){
 npcs.forEach(n=>{
  n.x+=n.dx;
  n.y+=n.dy;
  if(Math.random()<0.02){
   n.dx=Math.random()*2-1;
   n.dy=Math.random()*2-1;
  }
 });
}

// машины движение
function updateCars(){
 cars.forEach(car=>{
  car.x+=car.speed;
  if(car.x>2000) car.x=0;
 });
}

// рисование
function draw(){
 ctx.clearRect(0,0,c.width,c.height);
 let m=cam();

 // трава
 ctx.fillStyle="#6fdc3c";
 ctx.fillRect(0,0,c.width,c.height);

 // здания (город)
 buildings.forEach(b=>{
  ctx.fillStyle="#555";
  ctx.fillRect(b.x-m.x,b.y-m.y,b.w,b.h);
 });

 // машины
 cars.forEach(car=>{
  ctx.fillStyle="red";
  ctx.fillRect(car.x-m.x,car.y-m.y,30,15);
 });

 // NPC люди
 npcs.forEach(n=>{
  ctx.fillStyle="yellow";
  ctx.fillRect(n.x-5-m.x,n.y-5-m.y,10,10);

  // голова
  ctx.beginPath();
  ctx.arc(n.x-m.x,n.y-10-m.y,4,0,6.28);
  ctx.fill();
 });

 // игрок
 ctx.fillStyle="blue";
 ctx.fillRect(player.x-10-m.x,player.y-10-m.y,20,20);

 ctx.fillStyle="white";
 ctx.beginPath();
 ctx.arc(player.x-m.x,player.y-15-m.y,6,0,6.28);
 ctx.fill();
}

// цикл
function loop(){
 move();
 updateNPC();
 updateCars();
 draw();
 requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
