<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Моя игра</title>
<style>
body { margin:0; overflow:hidden; font-family:sans-serif; }
canvas { display:block; background:#6bdc6b; }

#ui {
 position:fixed;
 top:10px;
 left:10px;
 background:rgba(0,0,0,0.6);
 color:white;
 padding:10px;
 border-radius:10px;
}

#buttons {
 position:fixed;
 bottom:10px;
 right:10px;
}

button {
 margin:4px;
 padding:8px;
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="ui">
💰 Деньги: <span id="money">0</span><br>
📈 Доход: <span id="income">10</span>/2 сек
</div>

<div id="buttons">
<button onclick="mode='house'">🏠 Дом (50)</button>
<button onclick="mode='shop'">🏪 Магазин (80)</button>
<button onclick="mode='hotel'">🏨 Отель (150)</button>
<button onclick="mode='car'">🚗 Машина (60)</button>
<button onclick="upgrade()">⬆️ Улучшить (100)</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = innerWidth;
canvas.height = innerHeight;

// ===== ДАННЫЕ =====
let money = 100;
let income = 10;
let buildings = [];
let cars = [];
let mode = null;

// ===== ИГРОК =====
let player = { x:0, y:0, speed:4 };

// ===== УПРАВЛЕНИЕ =====
let keys = {};
addEventListener("keydown", e => keys[e.key]=true);
addEventListener("keyup", e => keys[e.key]=false);

// ===== СТРОИТЬ КЛИКОМ =====
canvas.addEventListener("click", e=>{
 let x = player.x + (e.clientX - canvas.width/2);
 let y = player.y + (e.clientY - canvas.height/2);

 if(mode==="house" && money>=50){
  money-=50;
  buildings.push({x,y,type:"house",level:1});
 }

 if(mode==="shop" && money>=80){
  money-=80;
  buildings.push({x,y,type:"shop",level:1});
 }

 if(mode==="hotel" && money>=150){
  money-=150;
  buildings.push({x,y,type:"hotel",level:1});
 }

 if(mode==="car" && money>=60){
  money-=60;
  cars.push({x,y,dir:Math.random()*Math.PI*2});
 }
});

// ===== УЛУЧШЕНИЕ =====
function upgrade(){
 if(money>=100){
  money-=100;
  income+=5;
 }
}

// ===== ДЕНЬГИ =====
setInterval(()=>{
 money += income;
},2000);

// ===== ОБНОВЛЕНИЕ =====
function update(){
 if(keys["w"]) player.y -= player.speed;
 if(keys["s"]) player.y += player.speed;
 if(keys["a"]) player.x -= player.speed;
 if(keys["d"]) player.x += player.speed;

 cars.forEach(c=>{
  c.x += Math.cos(c.dir)*2;
  c.y += Math.sin(c.dir)*2;
 });
}

// ===== РЕНДЕР =====
function draw(){
 ctx.clearRect(0,0,canvas.width,canvas.height);

 let camX = player.x - canvas.width/2;
 let camY = player.y - canvas.height/2;

 // дороги
 ctx.fillStyle="#888";
 for(let x=-2000;x<2000;x+=200){
  ctx.fillRect(x-camX, -2000-camY, 40, 4000);
 }
 for(let y=-2000;y<2000;y+=200){
  ctx.fillRect(-2000-camX, y-camY, 4000, 40);
 }

 // здания
 buildings.forEach(b=>{
  if(b.type==="house") ctx.fillStyle="red";
  if(b.type==="shop") ctx.fillStyle="blue";
  if(b.type==="hotel") ctx.fillStyle="purple";

  ctx.fillRect(b.x-camX, b.y-camY, 30, 30);
 });

 // машины
 cars.forEach(c=>{
  ctx.fillStyle="black";
  ctx.fillRect(c.x-camX, c.y-camY, 20, 10);
 });

 // игрок
 ctx.fillStyle="yellow";
 ctx.fillRect(canvas.width/2, canvas.height/2, 20, 30);

 ctx.fillStyle="#f5cba7";
 ctx.beginPath();
 ctx.arc(canvas.width/2+10, canvas.height/2-5, 10, 0, Math.PI*2);
 ctx.fill();

 // UI
 document.getElementById("money").innerText = money;
 document.getElementById("income").innerText = income;
}

// ===== ЦИКЛ =====
function loop(){
 update();
 draw();
 requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
