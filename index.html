<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Ultra City+</title>
<style>
body{margin:0;overflow:hidden;font-family:sans-serif;}
canvas{display:block;background:#6bdc6b;}
#ui{position:fixed;top:10px;left:10px;background:rgba(0,0,0,.6);color:white;padding:10px;}
#buttons{position:fixed;bottom:10px;right:10px;}
button{margin:4px;padding:8px;}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="ui">
💰 <span id="money">0</span><br>
📈 <span id="income">50</span>/сек<br>
E — машина | F — действие
</div>

<div id="buttons">
<button onclick="mode='house'">🏠</button>
<button onclick="mode='car'">🚗</button>
</div>

<script>
const c=document.getElementById("game");
const ctx=c.getContext("2d");
c.width=innerWidth;
c.height=innerHeight;

// сохранение
let save=JSON.parse(localStorage.getItem("game"))||{
 money:200,income:50,buildings:[],cars:[]
};

function saveGame(){
 localStorage.setItem("game",JSON.stringify(save));
}

let player={x:0,y:0,speed:4,inCar:false,car:null};
let keys={},mode=null;

// NPC
let npcs=[];
for(let i=0;i<8;i++){
 npcs.push({x:Math.random()*800,y:Math.random()*800});
}

// полиция
let police=[];
for(let i=0;i<3;i++){
 police.push({x:Math.random()*800,y:Math.random()*800});
}

// деньги
setInterval(()=>{
 save.money+=save.income;
 saveGame();
},1000);

// управление
addEventListener("keydown",e=>{
 keys[e.key]=true;

 if(e.key==="e"){
  save.cars.forEach(car=>{
   if(Math.hypot(car.x-player.x,car.y-player.y)<40){
    player.inCar=true;
    player.car=car;
   }
  });
 }

 // действие (стрельба просто эффект)
 if(e.key==="f"){
  npcs.forEach(n=>{
   if(Math.hypot(n.x-player.x,n.y-player.y)<60){
    n.x+=Math.random()*100-50;
    n.y+=Math.random()*100-50;
   }
  });
 }
});
addEventListener("keyup",e=>keys[e.key]=false);

// стройка
c.addEventListener("click",e=>{
 let x=player.x+(e.clientX-c.width/2);
 let y=player.y+(e.clientY-c.height/2);

 if(mode==="house"&&save.money>=50){
  save.money-=50;
  save.buildings.push({x,y});
 }

 if(mode==="car"&&save.money>=60){
  save.money-=60;
  save.cars.push({x,y});
 }
});

// движение
function update(){
 let speed=player.inCar?6:4;

 if(keys["w"])player.y-=speed;
 if(keys["s"])player.y+=speed;
 if(keys["a"])player.x-=speed;
 if(keys["d"])player.x+=speed;

 if(player.inCar&&player.car){
  player.car.x=player.x;
  player.car.y=player.y;
 }

 // полиция преследует
 police.forEach(p=>{
  let dx=player.x-p.x;
  let dy=player.y-p.y;
  let d=Math.hypot(dx,dy);
  p.x+=dx/d;
  p.y+=dy/d;
 });
}

// человек
function drawHuman(x,y,color="blue"){
 ctx.fillStyle="black";
 ctx.fillRect(x-5,y+10,4,10);
 ctx.fillRect(x+1,y+10,4,10);

 ctx.fillStyle=color;
 ctx.fillRect(x-8,y-5,16,20);

 ctx.fillRect(x-12,y,6,4);
 ctx.fillRect(x+6,y,6,4);

 ctx.fillStyle="#f5c6a5";
 ctx.beginPath();
 ctx.arc(x,y-12,8,0,Math.PI*2);
 ctx.fill();
}

// рендер
function draw(){
 ctx.clearRect(0,0,c.width,c.height);

 let camX=player.x-c.width/2;
 let camY=player.y-c.height/2;

 // здания
 save.buildings.forEach(b=>{
  ctx.fillStyle="red";
  ctx.fillRect(b.x-camX,b.y-camY,30,30);
 });

 // машины
 save.cars.forEach(car=>{
  ctx.fillStyle="black";
  ctx.fillRect(car.x-camX,car.y-camY,20,10);
 });

 // NPC
 npcs.forEach(n=>drawHuman(n.x-camX,n.y-camY));

 // полиция
 police.forEach(p=>drawHuman(p.x-camX,p.y-camY,"black"));

 // игрок
 drawHuman(c.width/2,c.height/2,"yellow");

 money.innerText=Math.floor(save.money);
 income.innerText=save.income;
}

// цикл
function loop(){
 update();
 draw();
 requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
