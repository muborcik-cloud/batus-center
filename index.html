<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Батутный центр Душанбе</title>

<style>
:root{
  --gold:#f5c542;
  --dark:#0b0b0b;
  --gray:#cfcfcf;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}

body{
  background:black;
  color:white;
  overflow-x:hidden;
}

/* VIDEO BACKGROUND */
.hero{
  position:relative;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}
.hero video{
  position:absolute;
  top:0;left:0;
  width:100%;height:100%;
  object-fit:cover;
  filter:brightness(0.4);
}
.hero-content{
  position:relative;
  z-index:2;
  padding:20px;
}
.hero h1{
  font-size:38px;
  color:var(--gold);
  margin-bottom:15px;
  animation:fadeUp 1s ease;
}
.hero p{
  font-size:17px;
  color:var(--gray);
  animation:fadeUp 1.4s ease;
}

/* BUTTONS */
.buttons{
  margin-top:25px;
  display:flex;
  gap:15px;
  justify-content:center;
  flex-wrap:wrap;
}
.btn{
  padding:14px 26px;
  border-radius:10px;
  font-weight:bold;
  text-decoration:none;
  font-size:15px;
}
.call{background:var(--gold);color:black}
.whatsapp{background:#25D366;color:black}
.price-btn{border:2px solid var(--gold);color:var(--gold)}

/* SECTIONS */
section{
  padding:70px 20px;
  max-width:1200px;
  margin:auto;
}
h2{
  text-align:center;
  font-size:30px;
  color:var(--gold);
  margin-bottom:30px;
}
p{text-align:center;font-size:16px;color:#ddd}

/* CARDS */
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:25px;
  margin-top:40px;
}
.card{
  background:#141414;
  border-radius:16px;
  padding:30px;
  text-align:center;
  border:1px solid #2a2a2a;
  transition:0.3s;
}
.card:hover{
  transform:translateY(-8px);
  border-color:var(--gold);
}
.card h3{
  color:var(--gold);
  margin-bottom:10px;
}
.price{
  font-size:26px;
  font-weight:bold;
  margin-top:15px;
}

/* TRUST */
.trust{
  background:linear-gradient(180deg,#0e0e0e,#151515);
  border-radius:20px;
}

/* MAP */
iframe{
  width:100%;
  height:360px;
  border:none;
  border-radius:16px;
}

/* FOOTER */
footer{
  padding:30px;
  text-align:center;
  color:#888;
  font-size:14px;
}

/* ANIMATION */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

/* LANG */
.lang{
  position:fixed;
  top:15px;
  right:15px;
  z-index:10;
}
.lang button{
  background:#1b1b1b;
  border:1px solid #333;
  color:white;
  padding:6px 12px;
  border-radius:6px;
  cursor:pointer;
}
</style>

<script>
function setLang(l){
  document.querySelectorAll('[data-ru]').forEach(el=>{
    el.innerText = l==='ru' ? el.dataset.ru : el.dataset.en;
  });
}
</script>
</head>

<body onload="setLang('ru')">

<div class="lang">
  <button onclick="setLang('ru')">RU</button>
  <button onclick="setLang('en')">EN</button>
</div>

<div class="hero">
  <video autoplay muted loop>
    <source src="https://cdn.coverr.co/videos/coverr-kids-playing-4260/1080p.mp4" type="video/mp4">
  </video>
  <div class="hero-content">
    <h1 data-ru="Лучший батутный центр в Душанбе"
        data-en="Best Trampoline Center in Dushanbe"></h1>
    <p data-ru="Эмоции, безопасность и радость для детей и родителей"
       data-en="Emotions, safety and fun for kids and parents"></p>

    <div class="buttons">
      <a href="tel:+992011900303" class="btn call">Позвонить</a>
      <a href="https://wa.me/992011900303" class="btn whatsapp">WhatsApp</a>
      <a href="#prices" class="btn price-btn">Цены</a>
    </div>
  </div>
</div>

<section class="trust">
  <h2 data-ru="Почему выбирают нас" data-en="Why choose us"></h2>
  <div class="cards">
    <div class="card">
      <h3 data-ru="Безопасно" data-en="Safe"></h3>
      <p data-ru="Современное оборудование и контроль"
         data-en="Modern equipment and supervision"></p>
    </div>
    <div class="card">
      <h3 data-ru="Весело" data-en="Fun"></h3>
      <p data-ru="Дети в восторге с первых минут"
         data-en="Kids love it from the first minute"></p>
    </div>
    <div class="card">
      <h3 data-ru="Выгодно" data-en="Affordable"></h3>
      <p data-ru="Честные цены без обмана"
         data-en="Fair prices with no tricks"></p>
    </div>
  </div>
</section>

<section id="prices">
  <h2 data-ru="Цены" data-en="Prices"></h2>
  <div class="cards">
    <div class="card">
      <h3>1 час</h3>
      <div class="price">100 сомони</div>
    </div>
    <div class="card">
      <h3>2 часа</h3>
      <div class="price">200 сомони</div>
    </div>
    <div class="card">
      <h3 data-ru="Безлимит" data-en="Unlimited"></h3>
      <div class="price">400 сомони</div>
    </div>
  </div>
</section>

<section>
  <h2 data-ru="Мы на карте" data-en="We are on the map"></h2>
  <iframe src="https://maps.google.com/maps?q=Dushanbe&t=&z=13&ie=UTF8&iwloc=&output=embed"></iframe>
</section>

<footer>
  © 2025 Батутный центр Душанбе • Сделано профессионально
</footer>

</body>
</html>
