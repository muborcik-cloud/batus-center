<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>3D City PRO+</title>
<style>
body { margin:0; overflow:hidden; }
#info{
 position:absolute;
 top:10px; left:10px;
 color:white;
 background:rgba(0,0,0,0.5);
 padding:10px;
}
</style>
</head>

<body>

<div id="info">
WASD — ходить<br>
E — сесть/выйти из машины
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158/build/three.min.js"></script>

<script>
// сцена
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

// камера
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);

// рендер
const renderer = new THREE.WebGLRenderer();
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// свет
const light = new THREE.DirectionalLight(0xffffff,1);
light.position.set(10,20,10);
scene.add(light);

// земля
const ground = new THREE.Mesh(
 new THREE.PlaneGeometry(200,200),
 new THREE.MeshStandardMaterial({color:0x55aa55})
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

// игрок (тело + голова)
const body = new THREE.Mesh(
 new THREE.BoxGeometry(1,1.5,1),
 new THREE.MeshStandardMaterial({color:0x0000ff})
);
body.position.y = 0.75;

const head = new THREE.Mesh(
 new THREE.SphereGeometry(0.5,16,16),
 new THREE.MeshStandardMaterial({color:0xffcc99})
);
head.position.y = 1.8;

const player = new THREE.Group();
player.add(body);
player.add(head);
scene.add(player);

// город
for(let i=0;i<100;i++){
 let h = Math.random()*20+5;
 let b = new THREE.Mesh(
  new THREE.BoxGeometry(2,h,2),
  new THREE.MeshStandardMaterial({color:0x888888})
 );
 b.position.set(Math.random()*180-90,h/2,Math.random()*180-90);
 scene.add(b);
}

// деревья
for(let i=0;i<50;i++){
 let tree = new THREE.Mesh(
  new THREE.ConeGeometry(1,3,8),
  new THREE.MeshStandardMaterial({color:0x228B22})
 );
 tree.position.set(Math.random()*180-90,1.5,Math.random()*180-90);
 scene.add(tree);
}

// машина
const car = new THREE.Mesh(
 new THREE.BoxGeometry(2,1,1),
 new THREE.MeshStandardMaterial({color:0xff0000})
);
car.position.set(5,0.5,5);
scene.add(car);

let inCar=false;

// управление
let keys={};
document.addEventListener("keydown",e=>{
 keys[e.key]=true;

 if(e.key==="e"){
  let dist = player.position.distanceTo(car.position);
  if(dist<3){
   inCar=!inCar;
  }
 }
});
document.addEventListener("keyup",e=>keys[e.key]=false);

// движение
function move(){
 let speed = inCar ? 0.5 : 0.2;

 if(inCar){
  if(keys["w"]) car.position.z-=speed;
  if(keys["s"]) car.position.z+=speed;
  if(keys["a"]) car.position.x-=speed;
  if(keys["d"]) car.position.x+=speed;

  player.position.copy(car.position);
 }else{
  if(keys["w"]) player.position.z-=speed;
  if(keys["s"]) player.position.z+=speed;
  if(keys["a"]) player.position.x-=speed;
  if(keys["d"]) player.position.x+=speed;
 }
}

// камера
function updateCamera(){
 camera.position.x = player.position.x;
 camera.position.z = player.position.z + 6;
 camera.position.y = player.position.y + 4;
 camera.lookAt(player.position);
}

// цикл
function animate(){
 requestAnimationFrame(animate);
 move();
 updateCamera();
 renderer.render(scene,camera);
}

animate();
</script>

</body>
</html>
