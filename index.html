<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Real Game</title>

<style>
body { margin:0; overflow:hidden; font-family:Arial; }

#ui{
 position:absolute;
 top:0; left:0;
 width:100%;
 background:#111;
 color:white;
 padding:10px;
 z-index:10;
}

canvas { display:block; background:#6ec1ff; }
</style>
</head>

<body>

<div id="ui">
💰 <span id="money">200</span> |
🏠 <span id="houses">0</span>
<br>
🎮 WASD — движение | E — дом | Q — улучшить
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

// мир
let worldSize = 2000;

// игрок
let player = { x:1000, y:1000, size:20, speed:4 };

// данные
let money = 200;
let houses = [];
let keys = {};

// управление
document.addEventListener("keydown", e=>{
  keys[e.key.toLowerCase()] = true;

  if(e.key === "e"){
    if(money >= 50){
      houses.push({x:player.x, y:player.y, level:1});
      money -= 50;
    }
  }

  if(e.key === "q"){
    let nearest=null, dist=60;

    houses.forEach(h=>{
      let d=Math.hypot(player.x-h.x, player.y-h.y);
      if(d < dist){ nearest=h; dist=d; }
    });

    if(nearest && nearest.level < 10){
      let cost = nearest.level * 40;
      if(money >= cost){
        money -= cost;
        nearest.level++;
      }
    }
  }
});

document.addEventListener("keyup", e=>{
  keys[e.key.toLowerCase()] = false;
});

// движение
function move(){
  if(keys["w"]) player.y -= player.speed;
  if(keys["s"]) player.y += player.speed;
  if(keys["a"]) player.x -= player.speed;
  if(keys["d"]) player.x += player.speed;
}

// доход
setInterval(()=>{
  houses.forEach(h=> money += h.level);
  updateUI();
},1000);

// цвета домов
function getColor(level){
  return [
    "#8B4513","#A0522D","#CD853F","#DEB887","#F4A460",
    "#FFD700","#FFA500","#FF8C00","#FF4500","#FF0000"
  ][level-1];
}

// камера (следит за игроком)
function getCamera(){
  return {
    x: player.x - canvas.width/2,
    y: player.y - canvas.height/2
  };
}

// рисование
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  let cam = getCamera();

  // земля (сеткой — уже выглядит лучше)
  for(let x=0; x<worldSize; x+=50){
    for(let y=0; y<worldSize; y+=50){
      ctx.fillStyle = (x+y)%100===0 ? "#7CFC00" : "#70e000";
      ctx.fillRect(x-cam.x, y-cam.y, 50, 50);
    }
  }

  // дома
  houses.forEach(h=>{
    ctx.fillStyle = getColor(h.level);
    ctx.fillRect(h.x-20-cam.x, h.y-20-cam.y, 40, 40);

    // уровень
    ctx.fillStyle="black";
    ctx.fillText(h.level, h.x-5-cam.x, h.y+5-cam.y);
  });

  // игрок (уже выглядит лучше)
  ctx.fillStyle="blue";
  ctx.beginPath();
  ctx.arc(player.x-cam.x, player.y-cam.y, 12, 0, Math.PI*2);
  ctx.fill();

  // тень
  ctx.fillStyle="rgba(0,0,0,0.2)";
  ctx.beginPath();
  ctx.ellipse(player.x-cam.x, player.y+10-cam.y, 12, 5, 0, 0, Math.PI*2);
  ctx.fill();
}

// UI
function updateUI(){
  document.getElementById("money").innerText = Math.floor(money);
  document.getElementById("houses").innerText = houses.length;
}

// цикл
function loop(){
  move();
  draw();
  requestAnimationFrame(loop);
}

updateUI();
loop();
</script>

</body>
</html>
