<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>City Level 4</title>
<style>
body { margin:0; overflow:hidden; }
canvas { display:block; }

#ui {
 position:fixed; top:10px; left:10px;
 color:white; background:rgba(0,0,0,0.6);
 padding:10px; border-radius:10px;
}

#buttons {
 position:fixed; bottom:10px; right:10px;
}

button {
 padding:10px; margin:5px;
 border:none; border-radius:8px;
 background:#333; color:white;
}

#joy {
 position:fixed; bottom:40px; left:40px;
 width:100px; height:100px;
 border-radius:50%;
 background:rgba(255,255,255,0.1);
}
#stick {
 width:40px; height:40px;
 background:white; border-radius:50%;
 position:absolute; left:30px; top:30px;
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="ui">
💰 <span id="money">0</span><br>
🏠 <span id="houses">0</span><br>
⭐ Уровень: <span id="level">1</span>
</div>

<div id="buttons">
<button onclick="buy('house')">Дом</button>
<button onclick="buy('car')">Машина</button>
<button onclick="buy('hotel')">Отель</button>
<button onclick="enterCar()">🚗 Сесть</button>
</div>

<div id="joy"><div id="stick"></div></div>

<script>
const c = game;
const ctx = c.getContext("2d");
c.width = innerWidth;
c.height = innerHeight;

// --- данные ---
let money=0, level=1;
let houses=[], cars=[], hotels=[], bullets=[];
let police=[], npcs=[];

let player = {x:300,y:300,inCar:false};

// загрузка
if(localStorage.save){
 let s=JSON.parse(localStorage.save);
 money=s.money; houses=s.houses;
}

// доход
setInterval(()=>{
 money += houses.length*5 + hotels.length*20 + 10;
 save();
},1000);

function save(){
 localStorage.save = JSON.stringify({money,houses});
}

// покупки
function buy(type){
 if(type=="house" && money>=50){
  money-=50; houses.push(randObj());
 }
 if(type=="car" && money>=100){
  money-=100; cars.push(randObj());
 }
 if(type=="hotel" && money>=200){
  money-=200; hotels.push(randObj());
 }
}

// случайная позиция
function randObj(){
 return {x:Math.random()*c.width,y:Math.random()*c.height};
}

// NPC
for(let i=0;i<10;i++){
 npcs.push({...randObj(),dx:1,dy:1});
}

// полиция
for(let i=0;i<4;i++){
 police.push({...randObj(),dx:2,dy:2});
}

// джойстик
let joy={x:0,y:0};
joyDiv.addEventListener("touchmove",e=>{
 let t=e.touches[0];
 joy.x=(t.clientX-90)/50;
 joy.y=(t.clientY-90)/50;
});
joyDiv.addEventListener("touchend",()=>joy={x:0,y:0});

// управление
document.addEventListener("click",e=>{
 bullets.push({x:player.x,y:player.y,dx:5,dy:0});
});

// сесть в машину
function enterCar(){
 cars.forEach(c=>{
  if(dist(player,c)<50) player.inCar=true;
 });
}

// расстояние
function dist(a,b){
 return Math.hypot(a.x-b.x,a.y-b.y);
}

// день/ночь
let night=false;
setInterval(()=>night=!night,5000);

// обновление
function update(){
 let sp = player.inCar?6:3;
 player.x += joy.x*sp;
 player.y += joy.y*sp;

 // пули
 bullets.forEach(b=>b.x+=b.dx);

 // NPC
 npcs.forEach(n=>{
  n.x+=n.dx; n.y+=n.dy;
 });

 // полиция преследует
 police.forEach(p=>{
  let dx=player.x-p.x;
  let dy=player.y-p.y;
  let d=Math.hypot(dx,dy);
  if(d<200){
   p.x+=dx/d*2;
   p.y+=dy/d*2;
  }
 });

 // ловля
 police.forEach(p=>{
  if(dist(player,p)<20){
   money = Math.max(0,money-100);
  }
 });

 level = Math.floor(money/500)+1;
}

// рисование
function draw(){
 ctx.fillStyle = night ? "#001" : "#4caf50";
 ctx.fillRect(0,0,c.width,c.height);

 // дороги
 ctx.fillStyle="#777";
 for(let i=0;i<c.width;i+=150){
  ctx.fillRect(i,0,40,c.height);
 }
 for(let j=0;j<c.height;j+=150){
  ctx.fillRect(0,j,c.width,40);
 }

 // дома
 houses.forEach(h=>{
  ctx.fillStyle="red";
  ctx.fillRect(h.x,h.y,30,30);
 });

 // отели
 hotels.forEach(h=>{
  ctx.fillStyle="purple";
  ctx.fillRect(h.x,h.y,40,40);
 });

 // машины
 cars.forEach(c=>{
  ctx.fillStyle="blue";
  ctx.fillRect(c.x,c.y,40,20);
 });

 // полиция
 police.forEach(p=>{
  ctx.fillStyle="white";
  ctx.fillRect(p.x,p.y,30,15);
 });

 // NPC
 npcs.forEach(n=>{
  ctx.fillStyle="yellow";
  ctx.fillRect(n.x,n.y,8,8);
 });

 // пули
 bullets.forEach(b=>{
  ctx.fillStyle="orange";
  ctx.fillRect(b.x,b.y,5,5);
 });

 // игрок
 ctx.fillStyle="black";
 ctx.beginPath();
 ctx.arc(player.x,player.y,10,0,6.28);
 ctx.fill();

 // UI
 moneyEl.innerText=money;
 housesEl.innerText=houses.length;
 levelEl.innerText=level;
}

// цикл
function loop(){
 update();
 draw();
 requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
