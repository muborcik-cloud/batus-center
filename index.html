<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>BATUS — Premium Trampoline Park</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Inter',sans-serif;
  background:#0a0a0a;
  color:#fff;
  line-height:1.6;
}

/* LANG */
.lang{
  position:fixed;top:18px;right:18px;
  display:flex;gap:10px;z-index:100;
}
.lang button{
  padding:7px 14px;border-radius:20px;
  border:none;background:#1a1a1a;color:#fff;
  font-weight:700;cursor:pointer
}
.lang .active{background:#ffcc00;color:#000}

/* HERO */
.hero{height:100vh;position:relative;overflow:hidden}
.hero video{
  position:absolute;width:100%;height:100%;object-fit:cover
}
.hero::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.4),rgba(0,0,0,.9))
}
.hero-content{
  position:relative;z-index:2;
  height:100%;
  display:flex;align-items:center;
  justify-content:center;text-align:center;
  padding:20px
}
.hero h1{
  font-size:clamp(28px,5vw,56px);
  font-weight:800;
}
.hero p{
  max-width:720px;margin:20px auto 30px;
  font-size:clamp(15px,2.2vw,18px);
  opacity:.9
}

/* BUTTONS */
.btns{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.btn{
  padding:14px 34px;border-radius:999px;
  font-weight:800;text-decoration:none;
  color:#000;
  background:linear-gradient(135deg,#ff0080,#ffcc00);
  box-shadow:0 15px 40px rgba(255,0,128,.35);
  transition:.3s
}
.btn.alt{
  background:#fff;color:#000
}
.btn:hover{transform:translateY(-4px)}

/* SECTIONS */
section{
  max-width:1200px;
  margin:auto;
  padding:90px 20px;
}
h2{
  text-align:center;
  font-size:clamp(24px,4vw,40px);
  font-weight:800;
  margin-bottom:14px
}
section p{
  max-width:760px;
  margin:0 auto 50px;
  text-align:center;
  opacity:.9
}

/* STATS */
.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:26px
}
.stat{
  background:#111;
  border-radius:24px;
  padding:36px 24px;
  text-align:center
}
.stat b{
  font-size:42px;
  color:#ffcc00;
  display:block
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:26px
}
.card{
  background:#111;border-radius:24px;
  padding:32px;text-align:center;
  transition:.3s
}
.card:hover{transform:translateY(-8px)}
.price{
  font-size:36px;
  font-weight:800;
  color:#ffcc00
}

/* GALLERY */
.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px
}
.gallery img{
  width:100%;
  border-radius:18px;
  transition:.3s
}
.gallery img:hover{transform:scale(1.06)}

/* TESTIMONIALS */
.quote{
  background:#111;
  border-radius:24px;
  padding:28px;
  font-size:15px
}
.quote b{display:block;margin-top:12px;color:#ffcc00}

/* FORM */
form{
  max-width:520px;
  margin:auto;
  display:grid;
  gap:14px
}
input,button{
  padding:14px;
  border-radius:14px;
  border:none;
  font-size:15px
}
input{background:#1a1a1a;color:#fff}
button{
  background:linear-gradient(135deg,#00ffcc,#00ccff);
  font-weight:800;cursor:pointer
}

/* MAP */
iframe{
  width:100%;
  height:420px;
  border:none;
  border-radius:24px
}

/* FLOAT */
.float{
  position:fixed;right:20px;bottom:20px;
  display:flex;flex-direction:column;gap:12px
}
.float a{
  padding:14px 18px;
  border-radius:30px;
  background:#25D366;
  color:#000;
  font-weight:800;
  text-decoration:none
}
</style>
</head>

<body>

<div class="lang">
  <button id="ru" class="active">RU</button>
  <button id="en">EN</button>
</div>

<!-- HERO -->
<div class="hero">
<video autoplay muted loop playsinline>
<source src="https://cdn.coverr.co/videos/coverr-kids-jumping-on-trampoline-5267/1080p.mp4">
</video>
<div class="hero-content">
<div>
<h1 data-ru="BATUS — батутный парк нового поколения"
    data-en="BATUS — next generation trampoline park"></h1>
<p data-ru="Премиальный батутный центр в Душанбе. Безопасность. Эмоции. Доверие."
   data-en="Premium trampoline park in Dushanbe. Safety. Emotions. Trust."></p>
<div class="btns">
<a class="btn" href="tel:+992011900303" data-ru="Позвонить" data-en="Call"></a>
<a class="btn alt" href="https://wa.me/992011900303">WhatsApp</a>
</div>
</div>
</div>
</div>

<!-- STATS -->
<section>
<div class="stats">
<div class="stat"><b>10 000+</b><span data-ru="счастливых детей" data-en="happy kids"></span></div>
<div class="stat"><b>5 лет</b><span data-ru="опыта" data-en="experience"></span></div>
<div class="stat"><b>100%</b><span data-ru="безопасность" data-en="safety"></span></div>
<div class="stat"><b>№1</b><span data-ru="в Душанбе" data-en="in Dushanbe"></span></div>
</div>
</section>

<!-- PRICES -->
<section>
<h2 data-ru="Цены" data-en="Prices"></h2>
<div class="grid">
<div class="card"><h3>Basic</h3><div class="price">100 c.</div></div>
<div class="card"><h3>Standard</h3><div class="price">200 c.</div></div>
<div class="card"><h3>Premium</h3><div class="price">400 c.</div></div>
</div>
</section>

<!-- TESTIMONIALS -->
<section>
<h2 data-ru="Отзывы родителей" data-en="Parents reviews"></h2>
<div class="grid">
<div class="quote">Очень безопасно и красиво. Дети в восторге!<b>— Мадина</b></div>
<div class="quote">Лучший батутный центр в городе.<b>— Фаррух</b></div>
<div class="quote">Профессиональный персонал и чистота.<b>— Алина</b></div>
</div>
</section>

<!-- MAP -->
<section>
<h2 data-ru="Как нас найти" data-en="How to find us"></h2>
<iframe src="https://maps.google.com/maps?q=Душанбе&t=&z=13&ie=UTF8&iwloc=&output=embed"></iframe>
</section>

<div class="float">
<a href="tel:+992011900303">📞</a>
<a href="https://wa.me/992011900303">💬</a>
</div>

<script>
const ru=document.getElementById('ru');
const en=document.getElementById('en');
const el=document.querySelectorAll('[data-ru]');
function setLang(l){
  el.forEach(e=>e.textContent=e.dataset[l]);
  ru.classList.toggle('active',l==='ru');
  en.classList.toggle('active',l==='en');
}
ru.onclick=()=>setLang('ru');
en.onclick=()=>setLang('en');
setLang('ru');
</script>

</body>
</html>
