<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Мой Тайкун</title>
<style>
body { margin:0; overflow:hidden; font-family:sans-serif; }
canvas { background:#6bdc6b; display:block; }

#ui {
 position:fixed;
 top:10px;
 left:10px;
 background:rgba(0,0,0,0.6);
 color:white;
 padding:10px;
 border-radius:10px;
}

#buttons {
 position:fixed;
 bottom:10px;
 right:10px;
}

button {
 margin:5px;
 padding:10px;
 font-size:14px;
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="ui">
💰 Деньги: <span id="money">0</span><br>
🏠 Дома: <span id="houses">0</span><br>
📈 Доход: <span id="income">5</span>/сек
</div>

<div id="buttons">
<button onclick="buyHouse()">🏠 Дом (50)</button>
<button onclick="upgrade()">⬆️ Улучшить (100)</button>
<button onclick="buyCar()">🚗 Машина (60)</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = innerWidth;
canvas.height = innerHeight;

// ===== СОХРАНЕНИЕ =====
let save = JSON.parse(localStorage.getItem("save")) || {
 money: 100,
 houses: 0,
 income: 5,
 cars: []
};

// ===== ИГРОК =====
let player = { x:300, y:300, speed:3 };

// ===== УПРАВЛЕНИЕ =====
let keys = {};
addEventListener("keydown", e => keys[e.key]=true);
addEventListener("keyup", e => keys[e.key]=false);

// ===== ФУНКЦИИ =====
function buyHouse(){
 if(save.money>=50){
  save.money-=50;
  save.houses++;
  save.income+=2;
 }
}

function upgrade(){
 if(save.money>=100){
  save.money-=100;
  save.income+=5;
 }
}

function buyCar(){
 if(save.money>=60){
  save.money-=60;
  save.cars.push({
   x:Math.random()*canvas.width,
   y:Math.random()*canvas.height,
   dir:Math.random()*2
  });
 }
}

// ===== ДЕНЬГИ КАЖДУЮ СЕКУНДУ =====
setInterval(()=>{
 save.money += save.income;
 saveGame();
},1000);

// ===== СОХРАНИТЬ =====
function saveGame(){
 localStorage.setItem("save", JSON.stringify(save));
}

// ===== ОБНОВЛЕНИЕ =====
function update(){
 if(keys["w"]) player.y-=player.speed;
 if(keys["s"]) player.y+=player.speed;
 if(keys["a"]) player.x-=player.speed;
 if(keys["d"]) player.x+=player.speed;

 // движение машин
 save.cars.forEach(car=>{
  car.x += Math.cos(car.dir)*2;
  car.y += Math.sin(car.dir)*2;

  if(car.x<0||car.x>canvas.width) car.dir=Math.PI-car.dir;
  if(car.y<0||car.y>canvas.height) car.dir=-car.dir;
 });
}

// ===== РЕНДЕР =====
function draw(){
 ctx.clearRect(0,0,canvas.width,canvas.height);

 // дороги (сетка)
 ctx.fillStyle="#888";
 for(let x=0;x<canvas.width;x+=100){
  ctx.fillRect(x,0,20,canvas.height);
 }
 for(let y=0;y<canvas.height;y+=100){
  ctx.fillRect(0,y,canvas.width,20);
 }

 // дома
 for(let i=0;i<save.houses;i++){
  ctx.fillStyle="red";
  ctx.fillRect(100+i*30,100,20,20);
 }

 // машины
 save.cars.forEach(car=>{
  ctx.fillStyle="black";
  ctx.fillRect(car.x,car.y,15,10);
 });

 // игрок
 ctx.fillStyle="blue";
 ctx.fillRect(player.x,player.y,20,30);

 ctx.fillStyle="#f5cba7";
 ctx.beginPath();
 ctx.arc(player.x+10, player.y-5, 10, 0, Math.PI*2);
 ctx.fill();

 // UI
 document.getElementById("money").innerText = save.money;
 document.getElementById("houses").innerText = save.houses;
 document.getElementById("income").innerText = save.income;
}

// ===== ЦИКЛ =====
function gameLoop(){
 update();
 draw();
 requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
