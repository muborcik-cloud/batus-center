<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Real Game 2</title>

<style>
body { margin:0; overflow:hidden; font-family:Arial; }

#ui{
 position:absolute;
 top:0;
 width:100%;
 background:#111;
 color:white;
 padding:10px;
}

#btn{
 position:absolute;
 bottom:20px;
 left:20px;
 padding:15px;
 font-size:16px;
}

canvas { display:block; }
</style>
</head>

<body>

<div id="ui">
💰 <span id="money">200</span> |
🏠 <span id="houses">0</span>
</div>

<button id="btn">🏠 Построить дом</button>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

let player = {x:300,y:300,size:25};
let houses = [];
let trees = [];
let money = 200;

// создаём деревья
for(let i=0;i<30;i++){
 trees.push({
  x: Math.random()*2000,
  y: Math.random()*2000
 });
}

// кнопка
document.getElementById("btn").onclick = ()=>{
 if(money >= 50){
  houses.push({x:player.x,y:player.y,level:1});
  money -= 50;
 }
};

// движение (касание для телефона)
canvas.addEventListener("touchmove", e=>{
 let t = e.touches[0];
 player.x += (t.clientX - canvas.width/2)*0.01;
 player.y += (t.clientY - canvas.height/2)*0.01;
});

// доход
setInterval(()=>{
 houses.forEach(h=> money += h.level);
 updateUI();
},1000);

// камера
function cam(){
 return {
  x: player.x - canvas.width/2,
  y: player.y - canvas.height/2
 };
}

// рисуем
function draw(){
 ctx.clearRect(0,0,canvas.width,canvas.height);

 let c = cam();

 // трава
 ctx.fillStyle="#6fdc3c";
 ctx.fillRect(0,0,canvas.width,canvas.height);

 // деревья
 trees.forEach(t=>{
  ctx.fillStyle="green";
  ctx.beginPath();
  ctx.arc(t.x-c.x, t.y-c.y, 15, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle="brown";
  ctx.fillRect(t.x-3-c.x, t.y-c.y, 6, 15);
 });

 // дома
 houses.forEach(h=>{
  ctx.fillStyle="brown";
  ctx.fillRect(h.x-20-c.x, h.y-20-c.y, 40, 40);

  ctx.fillStyle="red";
  ctx.beginPath();
  ctx.moveTo(h.x-20-c.x, h.y-20-c.y);
  ctx.lineTo(h.x+20-c.x, h.y-20-c.y);
  ctx.lineTo(h.x-c.x, h.y-40-c.y);
  ctx.fill();
 });

 // игрок
 ctx.fillStyle="blue";
 ctx.beginPath();
 ctx.arc(player.x-c.x, player.y-c.y, 12, 0, Math.PI*2);
 ctx.fill();
}

// UI
function updateUI(){
 document.getElementById("money").innerText = Math.floor(money);
 document.getElementById("houses").innerText = houses.length;
}

// цикл
function loop(){
 draw();
 requestAnimationFrame(loop);
}

updateUI();
loop();
</script>

</body>
</html>
