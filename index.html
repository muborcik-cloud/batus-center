<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>City Builder</title>

<style>
body {
  margin:0;
  overflow:hidden;
  font-family:Arial;
}

#ui{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  background:#222;
  color:white;
  padding:10px;
}

#game{
  background:#87CEEB;
  display:block;
}
</style>
</head>

<body>

<div id="ui">
💰 Деньги: <span id="money">100</span> |
🏠 Домов: <span id="houses">0</span>
<br>
🎮 WASD — движение | E — построить дом
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

let money = 100;
let houses = [];

let player = {
  x: 200,
  y: 200,
  size: 20,
  speed: 3
};

let keys = {};

// управление
document.addEventListener("keydown", e=>{
  keys[e.key.toLowerCase()] = true;

  // строить дом
  if(e.key.toLowerCase() === "e"){
    if(money >= 50){
      houses.push({
        x: player.x,
        y: player.y,
        level:1
      });
      money -= 50;
    }
  }
});

document.addEventListener("keyup", e=>{
  keys[e.key.toLowerCase()] = false;
});

// доход
setInterval(()=>{
  houses.forEach(h=>{
    money += h.level;
  });
  updateUI();
},1000);

// движение
function move(){
  if(keys["w"]) player.y -= player.speed;
  if(keys["s"]) player.y += player.speed;
  if(keys["a"]) player.x -= player.speed;
  if(keys["d"]) player.x += player.speed;
}

// рисуем
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // земля
  ctx.fillStyle = "#7CFC00";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // дома
  houses.forEach(h=>{
    ctx.fillStyle = "brown";
    ctx.fillRect(h.x-15,h.y-15,30,30);

    // крыша
    ctx.fillStyle = "red";
    ctx.beginPath();
    ctx.moveTo(h.x-15,h.y-15);
    ctx.lineTo(h.x+15,h.y-15);
    ctx.lineTo(h.x,h.y-35);
    ctx.fill();
  });

  // игрок
  ctx.fillStyle = "blue";
  ctx.fillRect(player.x-10, player.y-10, 20, 20);
}

// UI
function updateUI(){
  document.getElementById("money").innerText = money;
  document.getElementById("houses").innerText = houses.length;
}

// цикл игры
function gameLoop(){
  move();
  draw();
  requestAnimationFrame(gameLoop);
}

updateUI();
gameLoop();
</script>

</body>
</html>
