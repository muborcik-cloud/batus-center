<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Город Тайкун</title>
<style>
body { margin:0; overflow:hidden; font-family:sans-serif; }
canvas { display:block; background:#6bdc6b; }

#ui {
 position:fixed;
 top:10px;
 left:10px;
 background:rgba(0,0,0,0.6);
 color:white;
 padding:10px;
 border-radius:10px;
}

#buttons {
 position:fixed;
 bottom:10px;
 right:10px;
}

button {
 margin:5px;
 padding:10px;
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="ui">
💰 Деньги: <span id="money">0</span><br>
🏠 Дома: <span id="houses">0</span>
</div>

<div id="buttons">
<button onclick="buyHouse()">🏠 Дом (50)</button>
<button onclick="buyCar()">🚗 Машина (60)</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

// ===== ДАННЫЕ =====
let money = 100;
let houses = [];
let cars = [];

// ===== ИГРОК =====
let player = { x:0, y:0, speed:4 };

// ===== УПРАВЛЕНИЕ =====
let keys = {};
addEventListener("keydown", e => keys[e.key]=true);
addEventListener("keyup", e => keys[e.key]=false);

// ===== ФУНКЦИИ =====
function buyHouse(){
 if(money>=50){
  money-=50;
  houses.push({x:player.x, y:player.y});
 }
}

function buyCar(){
 if(money>=60){
  money-=60;
  cars.push({
   x:player.x,
   y:player.y,
   dir:Math.random()*Math.PI*2
  });
 }
}

// деньги
setInterval(()=>{
 money+=5;
},1000);

// ===== ОБНОВЛЕНИЕ =====
function update(){
 if(keys["w"]) player.y -= player.speed;
 if(keys["s"]) player.y += player.speed;
 if(keys["a"]) player.x -= player.speed;
 if(keys["d"]) player.x += player.speed;

 cars.forEach(c=>{
  c.x += Math.cos(c.dir)*2;
  c.y += Math.sin(c.dir)*2;
 });
}

// ===== РЕНДЕР =====
function draw(){
 ctx.clearRect(0,0,canvas.width,canvas.height);

 // камера (игрок по центру)
 let camX = player.x - canvas.width/2;
 let camY = player.y - canvas.height/2;

 // дороги
 ctx.fillStyle="#888";
 for(let x=-2000;x<2000;x+=200){
  ctx.fillRect(x-camX, -2000-camY, 40, 4000);
 }
 for(let y=-2000;y<2000;y+=200){
  ctx.fillRect(-2000-camX, y-camY, 4000, 40);
 }

 // дома
 houses.forEach(h=>{
  ctx.fillStyle="red";
  ctx.fillRect(h.x-camX, h.y-camY, 30, 30);
 });

 // машины
 cars.forEach(c=>{
  ctx.fillStyle="black";
  ctx.fillRect(c.x-camX, c.y-camY, 20, 10);
 });

 // игрок
 ctx.fillStyle="blue";
 ctx.fillRect(canvas.width/2, canvas.height/2, 20, 30);

 ctx.fillStyle="#f5cba7";
 ctx.beginPath();
 ctx.arc(canvas.width/2+10, canvas.height/2-5, 10, 0, Math.PI*2);
 ctx.fill();

 // UI
 document.getElementById("money").innerText = money;
 document.getElementById("houses").innerText = houses.length;
}

// ===== ЦИКЛ =====
function loop(){
 update();
 draw();
 requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
