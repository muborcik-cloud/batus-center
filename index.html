<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>My Roblox Style Game</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#111;
  color:white;
  text-align:center;
}

#top{
  background:#222;
  padding:15px;
  font-size:20px;
}

#clickBtn{
  background:red;
  color:white;
  border:none;
  padding:20px;
  font-size:20px;
  border-radius:10px;
  margin:20px;
  cursor:pointer;
}

#shop{
  margin-top:20px;
}

button{
  margin:5px;
  padding:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.house{
  display:inline-block;
  width:60px;
  height:60px;
  margin:5px;
  background:brown;
}

.level2{ background:orange; }
.level3{ background:gold; }

</style>
</head>

<body>

<div id="top">
💰 Деньги: <span id="money">0</span>
</div>

<button id="clickBtn">🔴 ЖМИ ДЛЯ ДЕНЕГ</button>

<div id="shop">
<h3>🏠 Строительство</h3>
<button onclick="buyHouse()">Купить дом (50)</button>
<button onclick="upgrade()">Улучшить дом (100)</button>
</div>

<div id="houses"></div>

<script>
let money = 0;
let houses = [];
let income = 0;

// кнопка денег
document.getElementById("clickBtn").onclick = () => {
  money += 1;
  update();
};

// купить дом
function buyHouse(){
  if(money >= 50){
    money -= 50;
    houses.push(1);
    income += 1;
    render();
  }
}

// улучшение
function upgrade(){
  if(money >= 100){
    for(let i=0;i<houses.length;i++){
      if(houses[i] < 3){
        money -= 100;
        houses[i]++;
        income += 2;
        break;
      }
    }
    render();
  }
}

// доход
setInterval(()=>{
  money += income;
  update();
},1000);

// обновление UI
function update(){
  document.getElementById("money").innerText = money;
}

// отображение домов
function render(){
  update();
  const div = document.getElementById("houses");
  div.innerHTML = "";

  houses.forEach(level=>{
    const h = document.createElement("div");
    h.className = "house";
    if(level === 2) h.classList.add("level2");
    if(level === 3) h.classList.add("level3");
    div.appendChild(h);
  });
}
</script>

</body>
</html>
