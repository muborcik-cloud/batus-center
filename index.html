<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Mobile Builder Game</title>

<style>
body { margin:0; overflow:hidden; font-family:Arial; }

#ui{
 position:absolute;
 top:0;
 width:100%;
 background:#111;
 color:white;
 padding:10px;
 z-index:10;
}

#joystick{
 position:absolute;
 bottom:30px;
 left:30px;
 width:100px;
 height:100px;
 background:rgba(255,255,255,0.2);
 border-radius:50%;
}

#stick{
 position:absolute;
 width:40px;
 height:40px;
 background:white;
 border-radius:50%;
 left:30px;
 top:30px;
}

button{
 position:absolute;
 right:20px;
 padding:10px;
 margin-top:5px;
}
#build{ bottom:100px; }
#upgrade{ bottom:50px; }
</style>
</head>

<body>

<div id="ui">
💰 <span id="money">200</span> |
🏠 <span id="houses">0</span>
</div>

<div id="joystick"><div id="stick"></div></div>
<button id="build">🏠</button>
<button id="upgrade">⬆️</button>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

// игрок
let player = {x:500,y:500,size:20};

// данные
let money = 200;
let houses = [];
let trees = [];

// деревья
for(let i=0;i<40;i++){
 trees.push({
  x:Math.random()*2000,
  y:Math.random()*2000
 });
}

// джойстик
let joy = {x:0,y:0,active:false};
const stick = document.getElementById("stick");

document.getElementById("joystick").addEventListener("touchstart", e=>{
 joy.active = true;
});

document.addEventListener("touchmove", e=>{
 if(joy.active){
  let t = e.touches[0];
  let rect = document.getElementById("joystick").getBoundingClientRect();

  let dx = t.clientX - (rect.left+50);
  let dy = t.clientY - (rect.top+50);

  joy.x = dx/50;
  joy.y = dy/50;

  stick.style.left = (30+dx/2)+"px";
  stick.style.top = (30+dy/2)+"px";
 }
});

document.addEventListener("touchend", ()=>{
 joy.active=false;
 joy.x=0; joy.y=0;
 stick.style.left="30px";
 stick.style.top="30px";
});

// кнопки
document.getElementById("build").onclick = ()=>{
 if(money>=50){
  houses.push({x:player.x,y:player.y,level:1});
  money-=50;
 }
};

document.getElementById("upgrade").onclick = ()=>{
 let near=null,dist=50;

 houses.forEach(h=>{
  let d=Math.hypot(player.x-h.x,player.y-h.y);
  if(d<dist){near=h;dist=d;}
 });

 if(near && near.level<10){
  let cost = near.level*40;
  if(money>=cost){
   money-=cost;
   near.level++;
  }
 }
};

// движение
function move(){
 player.x += joy.x*4;
 player.y += joy.y*4;
}

// доход
setInterval(()=>{
 houses.forEach(h=> money += h.level);
 save();
 updateUI();
},1000);

// сохранение
function save(){
 localStorage.setItem("save", JSON.stringify({money,houses}));
}

function load(){
 let s = localStorage.getItem("save");
 if(s){
  let d = JSON.parse(s);
  money = d.money;
  houses = d.houses;
 }
}
load();

// цвета уровней
function color(l){
 return ["#8B4513","#A0522D","#CD853F","#DEB887","#F4A460",
 "#FFD700","#FFA500","#FF8C00","#FF4500","#FF0000"][l-1];
}

// камера
function cam(){
 return {
  x: player.x - canvas.width/2,
  y: player.y - canvas.height/2
 };
}

// рисование
function draw(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 let c = cam();

 // земля
 ctx.fillStyle="#6fdc3c";
 ctx.fillRect(0,0,canvas.width,canvas.height);

 // деревья
 trees.forEach(t=>{
  ctx.fillStyle="green";
  ctx.beginPath();
  ctx.arc(t.x-c.x,t.y-c.y,15,0,Math.PI*2);
  ctx.fill();
 });

 // дома
 houses.forEach(h=>{
  ctx.fillStyle=color(h.level);
  ctx.fillRect(h.x-20-c.x,h.y-20-c.y,40,40);
 });

 // персонаж (уже "человечек")
 ctx.fillStyle="blue";
 ctx.fillRect(player.x-10-c.x,player.y-10-c.y,20,20);

 ctx.fillStyle="white"; // голова
 ctx.beginPath();
 ctx.arc(player.x-c.x,player.y-15-c.y,6,0,Math.PI*2);
 ctx.fill();
}

// UI
function updateUI(){
 document.getElementById("money").innerText=Math.floor(money);
 document.getElementById("houses").innerText=houses.length;
}

// цикл
function loop(){
 move();
 draw();
 requestAnimationFrame(loop);
}

updateUI();
loop();
</script>

</body>
</html>
