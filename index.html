<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Next Level Game</title>
<style>
body { margin:0; overflow:hidden; }
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/three@0.158/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.158/examples/js/loaders/GLTFLoader.js"></script>

<script>
let scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

let camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);

let renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// свет
let light = new THREE.DirectionalLight(0xffffff,1);
light.position.set(10,20,10);
scene.add(light);

// земля
let ground = new THREE.Mesh(
 new THREE.PlaneGeometry(500,500),
 new THREE.MeshStandardMaterial({color:0x228B22})
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

// загрузка моделей
let loader = new THREE.GLTFLoader();

let player, mixer;
loader.load(
 "https://threejs.org/examples/models/gltf/RobotExpressive/RobotExpressive.glb",
 function(gltf){
   player = gltf.scene;
   player.scale.set(0.4,0.4,0.4);
   scene.add(player);

   mixer = new THREE.AnimationMixer(player);
   let action = mixer.clipAction(gltf.animations[0]);
   action.play();
 }
);

// машина
let car = new THREE.Mesh(
 new THREE.BoxGeometry(2,1,4),
 new THREE.MeshStandardMaterial({color:0xff0000})
);
car.position.set(5,0.5,5);
scene.add(car);

let speed = 0;
let angle = 0;

// управление
let keys = {};
document.addEventListener("keydown", e=>{
 keys[e.key.toLowerCase()] = true;
});
document.addEventListener("keyup", e=>{
 keys[e.key.toLowerCase()] = false;
});

camera.position.set(0,5,10);

let clock = new THREE.Clock();

function update(){

 // игрок
 if(player){
   let move = 0.1;

   if(keys["w"]) player.position.z -= move;
   if(keys["s"]) player.position.z += move;
   if(keys["a"]) player.position.x -= move;
   if(keys["d"]) player.position.x += move;

   camera.position.lerp(
     new THREE.Vector3(player.position.x,5,player.position.z+10),
     0.1
   );
   camera.lookAt(player.position);
 }

 // машина (реальная езда)
 if(keys["arrowup"]) speed += 0.02;
 if(keys["arrowdown"]) speed -= 0.02;
 if(keys["arrowleft"]) angle += 0.03;
 if(keys["arrowright"]) angle -= 0.03;

 speed *= 0.98;

 car.rotation.y = angle;
 car.position.x += Math.sin(angle)*speed;
 car.position.z += Math.cos(angle)*speed;

 // анимация
 if(mixer){
   mixer.update(clock.getDelta());
 }
}

function animate(){
 requestAnimationFrame(animate);
 update();
 renderer.render(scene, camera);
}

animate();
</script>

</body>
</html>
