<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>City Max</title>

<style>
body{margin:0;overflow:hidden;font-family:Arial;}

#ui{
 position:absolute;top:0;width:100%;
 background:#111;color:white;padding:10px;
 z-index:10;
}

#joy{
 position:absolute;bottom:20px;left:20px;
 width:100px;height:100px;
 background:rgba(255,255,255,0.3);
 border-radius:50%;
}

#stick{
 width:40px;height:40px;
 background:white;border-radius:50%;
 position:absolute;left:30px;top:30px;
}

.btn{
 position:absolute;right:20px;
 padding:10px;
}

#buy{bottom:200px;}
#car{bottom:150px;}
#shoot{bottom:100px;}
#save{bottom:50px;}
</style>
</head>

<body>

<div id="ui">
💰 <span id="money">200</span> |
🏠 <span id="houses">0</span> |
🚗 <span id="mode">пешком</span>
</div>

<div id="joy"><div id="stick"></div></div>

<button class="btn" id="buy">🏠 купить</button>
<button class="btn" id="car">🚗</button>
<button class="btn" id="shoot">🔫</button>
<button class="btn" id="save">💾</button>

<canvas id="game"></canvas>

<script>
const c = document.getElementById("game");
const ctx = c.getContext("2d");

c.width = innerWidth;
c.height = innerHeight;

let player={x:1000,y:1000};
let money=200;
let houses=[];
let inCar=false;

let cars=[{x:1100,y:1000}];
let bullets=[];
let npcs=[];

// NPC
for(let i=0;i<20;i++){
 npcs.push({
  x:Math.random()*2000,
  y:Math.random()*2000,
  dx:Math.random()*2-1,
  dy:Math.random()*2-1
 });
}

// джойстик
let joy={x:0,y:0};
const stick=document.getElementById("stick");

document.getElementById("joy").addEventListener("touchmove", e=>{
 let t=e.touches[0];
 let rect=e.target.getBoundingClientRect();

 let dx=t.clientX-(rect.left+50);
 let dy=t.clientY-(rect.top+50);

 joy.x=dx/50;
 joy.y=dy/50;

 stick.style.left=(30+dx/2)+"px";
 stick.style.top=(30+dy/2)+"px";
});

document.addEventListener("touchend", ()=>{
 joy.x=0;joy.y=0;
 stick.style.left="30px";
 stick.style.top="30px";
});

// движение
function move(){
 let speed = inCar ? 6 : 3;
 player.x+=joy.x*speed;
 player.y+=joy.y*speed;
}

// купить дом
buy.onclick=()=>{
 if(money>=100){
  houses.push({x:player.x,y:player.y});
  money-=100;
 }
};

// машина
car.onclick=()=>{
 inCar=!inCar;
};

// стрельба
shoot.onclick=()=>{
 bullets.push({x:player.x,y:player.y,dx:joy.x*10,dy:joy.y*10});
};

// обновление
function update(){
 // доход с домов
 houses.forEach(()=>money+=0.1);

 // пули
 bullets.forEach(b=>{
  b.x+=b.dx;
  b.y+=b.dy;
 });

 // NPC
 npcs.forEach(n=>{
  n.x+=n.dx;
  n.y+=n.dy;
 });

 // попадания
 bullets.forEach(b=>{
  npcs.forEach(n=>{
   let d=Math.hypot(b.x-n.x,b.y-n.y);
   if(d<10){
    n.x=Math.random()*2000;
    n.y=Math.random()*2000;
    money+=10;
   }
  });
 });

 document.getElementById("money").innerText=Math.floor(money);
 document.getElementById("houses").innerText=houses.length;
 document.getElementById("mode").innerText=inCar?"в машине":"пешком";
}

// сохранение
save.onclick=()=>{
 localStorage.setItem("save",JSON.stringify({money,houses}));
};

// камера
function cam(){
 return {x:player.x-c.width/2,y:player.y-c.height/2};
}

// рисование
function draw(){
 ctx.clearRect(0,0,c.width,c.height);
 let m=cam();

 // фон
 ctx.fillStyle="#6fdc3c";
 ctx.fillRect(0,0,c.width,c.height);

 // дома
 houses.forEach(h=>{
  ctx.fillStyle="brown";
  ctx.fillRect(h.x-15-m.x,h.y-15-m.y,30,30);
 });

 // машины
 cars.forEach(car=>{
  ctx.fillStyle="red";
  ctx.fillRect(car.x-m.x,car.y-m.y,30,15);
 });

 // NPC
 npcs.forEach(n=>{
  ctx.fillStyle="yellow";
  ctx.fillRect(n.x-5-m.x,n.y-5-m.y,10,10);
 });

 // пули
 ctx.fillStyle="black";
 bullets.forEach(b=>{
  ctx.fillRect(b.x-m.x,b.y-m.y,5,5);
 });

 // игрок
 ctx.fillStyle="blue";
 ctx.fillRect(player.x-10-m.x,player.y-10-m.y,20,20);
}

// цикл
function loop(){
 move();
 update();
 draw();
 requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
