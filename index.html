<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>City Game</title>
<style>
body{margin:0;overflow:hidden;}
canvas{display:block;background:#6bdc6b;}
#ui{position:fixed;top:10px;left:10px;background:#0008;color:#fff;padding:10px;}
button{margin:3px;}
#buttons{position:fixed;bottom:10px;right:10px;}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="ui">
💰 <span id="money">0</span>
</div>

<div id="buttons">
<button onclick="mode='house'">🏠</button>
<button onclick="mode='hospital'">🏥</button>
<button onclick="mode='car'">🚗</button>
</div>

<script>
const c=document.getElementById("game");
const ctx=c.getContext("2d");
c.width=innerWidth;
c.height=innerHeight;

// картинки
const imgHouse=new Image();
imgHouse.src="https://cdn-icons-png.flaticon.com/128/69/69524.png";

const imgHospital=new Image();
imgHospital.src="https://cdn-icons-png.flaticon.com/128/2967/2967350.png";

const imgCar=new Image();
imgCar.src="https://cdn-icons-png.flaticon.com/128/743/743131.png";

const imgPlayer=new Image();
imgPlayer.src="https://cdn-icons-png.flaticon.com/128/4140/4140048.png";

// данные
let money=100;
let buildings=[];
let cars=[];
let player={x:0,y:0};
let keys={},mode=null;

// деньги
setInterval(()=>{
 money+=50;
},1000);

// управление
addEventListener("keydown",e=>keys[e.key]=true);
addEventListener("keyup",e=>keys[e.key]=false);

// клик (строить)
c.onclick=e=>{
 let x=player.x+(e.clientX-c.width/2);
 let y=player.y+(e.clientY-c.height/2);

 if(mode==="house" && money>=50){
  money-=50;
  buildings.push({x,y,type:"house"});
 }
 if(mode==="hospital" && money>=100){
  money-=100;
  buildings.push({x,y,type:"hospital"});
 }
 if(mode==="car" && money>=60){
  money-=60;
  cars.push({x,y});
 }
};

// движение
function update(){
 if(keys["w"])player.y-=4;
 if(keys["s"])player.y+=4;
 if(keys["a"])player.x-=4;
 if(keys["d"])player.x+=4;
}

// рисуем
function draw(){
 ctx.clearRect(0,0,c.width,c.height);

 let camX=player.x-c.width/2;
 let camY=player.y-c.height/2;

 // дороги
 ctx.fillStyle="#777";
 for(let x=-2000;x<2000;x+=200){
  ctx.fillRect(x-camX,-2000-camY,40,4000);
 }
 for(let y=-2000;y<2000;y+=200){
  ctx.fillRect(-2000-camX,y-camY,4000,40);
 }

 // здания
 buildings.forEach(b=>{
  if(b.type==="house")
   ctx.drawImage(imgHouse,b.x-camX,b.y-camY,40,40);
  if(b.type==="hospital")
   ctx.drawImage(imgHospital,b.x-camX,b.y-camY,40,40);
 });

 // машины
 cars.forEach(car=>{
  ctx.drawImage(imgCar,car.x-camX,car.y-camY,40,20);
 });

 // игрок
 ctx.drawImage(imgPlayer,c.width/2-20,c.height/2-20,40,40);

 moneyEl.innerText=money;
}

const moneyEl=document.getElementById("money");

// цикл
function loop(){
 update();
 draw();
 requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
