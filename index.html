<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BATUS — Детский развлекательный центр</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffcc00, #ff6b6b);
      color: #fff;
      text-align: center;
    }
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    h1 {
      font-size: 42px;
      margin-bottom: 20px;
    }
    p {
      font-size: 20px;
      max-width: 600px;
    }
    .btn {
      margin-top: 30px;
      padding: 15px 30px;
      background: #fff;
      color: #ff6b6b;
      font-size: 18px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <section class="hero">
    <h1>BATUS 🎉</h1>
    <p>
      Самый яркий детский развлекательный центр в Душанбе.  
      3 этажа радости, игр и счастливых эмоций.
    </p>
    <a class="btn" href="#">Забронировать праздник</a>
  </section>
</body>
</html>
