<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Pro Builder Game</title>

<style>
body {
  margin:0;
  overflow:hidden;
  font-family:Arial;
}

#ui{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  background:#111;
  color:white;
  padding:10px;
}

canvas{
  display:block;
  background:#87CEEB;
}
</style>
</head>

<body>

<div id="ui">
💰 Деньги: <span id="money">200</span> |
🏠 Домов: <span id="count">0</span>
<br>
🎮 WASD — ходить | E — построить | Q — улучшить
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

let money = 200;

let player = {
  x:300,
  y:300,
  size:20,
  speed:3
};

let houses = [];
let keys = {};

// управление
document.addEventListener("keydown", e=>{
  keys[e.key.toLowerCase()] = true;

  // построить
  if(e.key.toLowerCase() === "e"){
    if(money >= 50){
      houses.push({
        x: player.x,
        y: player.y,
        level:1
      });
      money -= 50;
    }
  }

  // улучшить ближайший дом
  if(e.key.toLowerCase() === "q"){
    let nearest = null;
    let dist = 50;

    houses.forEach(h=>{
      let d = Math.hypot(player.x - h.x, player.y - h.y);
      if(d < dist){
        nearest = h;
        dist = d;
      }
    });

    if(nearest && nearest.level < 10){
      let cost = nearest.level * 50;

      if(money >= cost){
        money -= cost;
        nearest.level++;
      }
    }
  }
});

document.addEventListener("keyup", e=>{
  keys[e.key.toLowerCase()] = false;
});

// движение
function move(){
  if(keys["w"]) player.y -= player.speed;
  if(keys["s"]) player.y += player.speed;
  if(keys["a"]) player.x -= player.speed;
  if(keys["d"]) player.x += player.speed;
}

// доход
setInterval(()=>{
  houses.forEach(h=>{
    money += h.level; // чем выше уровень — тем больше доход
  });
  updateUI();
},1000);

// цвета уровней
function getColor(level){
  const colors = [
    "#8B4513","#A0522D","#CD853F","#DEB887","#F4A460",
    "#FFD700","#FFA500","#FF8C00","#FF4500","#FF0000"
  ];
  return colors[level-1];
}

// рисование
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // земля
  ctx.fillStyle = "#7CFC00";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // дома
  houses.forEach(h=>{
    ctx.fillStyle = getColor(h.level);
    ctx.fillRect(h.x-15,h.y-15,30,30);

    // уровень
    ctx.fillStyle = "black";
    ctx.fillText(h.level, h.x-5, h.y+5);
  });

  // игрок
  ctx.fillStyle = "blue";
  ctx.fillRect(player.x-10, player.y-10, 20, 20);
}

// UI
function updateUI(){
  document.getElementById("money").innerText = money;
  document.getElementById("count").innerText = houses.length;
}

// цикл
function loop(){
  move();
  draw();
  requestAnimationFrame(loop);
}

updateUI();
loop();
</script>

</body>
</html>
