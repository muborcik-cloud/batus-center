<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>BATUS — Premium Trampoline Park</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Лучший батутный центр в Душанбе. Безопасно, профессионально, для детей и взрослых.">
<meta name="keywords" content="батутный центр Душанбе, батуты Душанбе, детский центр Душанбе">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
--gold:#ffcc00;
--grad:linear-gradient(135deg,#ff0080,#ffcc00);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:'Inter',sans-serif;
background:#0b0b0b;
color:#fff;
line-height:1.6;
}

/* LANG */
.lang{
position:fixed;top:15px;right:15px;
z-index:999;display:flex;gap:8px
}
.lang button{
padding:6px 14px;border-radius:20px;
border:none;background:#1a1a1a;color:#fff;
font-weight:700;cursor:pointer
}
.lang .active{background:var(--gold);color:#000}

/* HERO */
.hero{
height:100vh;position:relative;overflow:hidden
}
.hero video{
position:absolute;width:100%;height:100%;object-fit:cover
}
.hero::after{
content:"";position:absolute;inset:0;
background:linear-gradient(180deg,rgba(0,0,0,.3),rgba(0,0,0,.95))
}
.hero-content{
position:relative;z-index:2;
height:100%;
display:flex;align-items:center;justify-content:center;
text-align:center;padding:20px
}
.hero h1{
font-size:clamp(28px,5vw,60px);
font-weight:800;
}
.hero p{
max-width:760px;margin:20px auto 30px;
font-size:clamp(15px,2vw,18px);opacity:.9
}

/* BUTTONS */
.btns{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.btn{
padding:14px 36px;border-radius:999px;
font-weight:800;text-decoration:none;color:#000;
background:var(--grad);
box-shadow:0 15px 40px rgba(255,0,128,.35);
transition:.3s
}
.btn.alt{background:#fff}
.btn:hover{transform:translateY(-4px)}

/* SECTION */
section{
max-width:1200px;margin:auto;
padding:90px 20px
}
h2{
text-align:center;
font-size:clamp(24px,4vw,42px);
font-weight:800;margin-bottom:14px
}
section p{
max-width:780px;margin:0 auto 50px;
text-align:center;opacity:.9
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:26px
}
.card{
background:#111;border-radius:26px;
padding:36px;text-align:center;
transition:.3s
}
.card:hover{transform:translateY(-8px)}
.price{
font-size:40px;font-weight:800;color:var(--gold)
}

/* STATS */
.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:26px
}
.stat{
background:#111;border-radius:26px;
padding:36px;text-align:center
}
.stat b{
font-size:44px;color:var(--gold);display:block
}

/* GALLERY */
.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:18px
}
.gallery img{
width:100%;border-radius:20px;
transition:.3s
}
.gallery img:hover{transform:scale(1.06)}

/* TESTIMONIAL */
.review{
background:#111;border-radius:26px;
padding:28px;font-size:15px
}
.review b{display:block;margin-top:12px;color:var(--gold)}

/* FORM */
form{
max-width:520px;margin:auto;
display:grid;gap:14px
}
input,button{
padding:14px;border-radius:14px;
border:none;font-size:15px
}
input{background:#1a1a1a;color:#fff}
button{
background:linear-gradient(135deg,#00ffcc,#00ccff);
font-weight:800;cursor:pointer
}

/* MAP */
iframe{
width:100%;height:420px;
border:none;border-radius:26px
}

/* FLOAT */
.float{
position:fixed;right:20px;bottom:20px;
display:flex;flex-direction:column;gap:12px;z-index:999
}
.float a{
padding:14px 18px;border-radius:30px;
background:#25D366;color:#000;
font-weight:800;text-decoration:none
}
</style>
</head>

<body>

<div class="lang">
<button id="ru" class="active">RU</button>
<button id="en">EN</button>
</div>

<!-- HERO -->
<div class="hero">

data-en="Premium trampoline park. Safe. Beautiful. Professional."></p>
<div class="btns">
<a class="btn" href="tel:+992011900303" data-ru="Позвонить" data-en="Call"></a>
<a class="btn alt" href="https://wa.me/992011900303">WhatsApp</a>

</div>
</div>
</div>

<!-- ABOUT -->
<section>

data-en="I am Muboriz. I created a next-level trampoline center in Dushanbe. Joy for kids, trust for parents."></p>
</section>

<!-- STATS -->
<section>

<div class="stat"><b>100%</b><span data-ru="безопасность" data-en="safety"></span></div>
<div class="stat"><b>№1</b><span data-ru="в Душанбе" data-en="in Dushanbe"></span></div>
</div>
</section>

<!-- PRICES -->
<section>
<h2 data-ru="Цены" data-en="Prices"></h2>
<div class="grid">
<div class="card"><h3>Basic</h3><div class="price">100 c.</div></div>
<div class="card"><h3>Standard</h3><div class="price">200 c.</div></div>

</div>
</section>

<!-- SAFETY -->
<section>
<h2 data-ru="Безопасность" data-en="Safety"></h2>
<p data-ru="Сертифицированные батуты, мягкие покрытия, профессиональные инструкторы и постоянный контроль."

</section>

<!-- GALLERY -->
<section>
<h2 data-ru="Галерея" data-en="Gallery"></h2>
<div class="gallery">
<img src="https://images.unsplash.com/photo-1600962815726-457c46a12681">
<img src="https://images.unsplash.com/photo-1571907483083-af70aeda3086">
<img src="https://images.unsplash.com/photo-1546519638-68e109498ffc">
<img src="https://images.unsplash.com/photo-1601582589907-f92af5ed9db8">
</div>
</section>

<!-- REVIEWS -->
<section>
<h2 data-ru="Отзывы родителей" data-en="Parents reviews"></h2>
<div class="grid">
<div class="review">Лучший центр! Безопасно и красиво.<b>— Мадина</b></div>

</div>
</section>

<!-- FORM -->
<section>
<h2 data-ru="Оставить заявку" data-en="Send request"></h2>
<form>
<input placeholder="Имя / Name">
<input placeholder="Телефон / Phone">
<button data-ru="Отправить" data-en="Send"></button>
</form>
</section>

<!-- MAP -->
<section>
<h2 data-ru="Как нас найти" data-en="How to find us"></h2>
<iframe src="https://maps.google.com/maps?q=Душанбе&t=&z=13&ie=UTF8&iwloc=&output=embed"></iframe>
</section>

<div class="float">
<a href="tel:+992011900303">📞</a>
<a href="https://wa.me/992011900303">💬</a>
</div>

<script>
const ru=document.getElementById('ru');
const en=document.getElementById('en');
const el=document.querySelectorAll('[data-ru]');
function setLang(l){
el.forEach(e=>e.textContent=e.dataset[l]);
ru.classList.toggle('active',l==='ru');
en.classList.toggle('active',l==='en');
}
ru.onclick=()=>setLang('ru');
en.onclick=()=>setLang('en');
setLang('ru');
</script>

</body>
  </html>
