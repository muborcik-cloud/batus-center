<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>3D Craft Game</title>
<style>
body { margin:0; overflow:hidden; }
#info {
  position:absolute;
  top:10px;
  left:10px;
  color:white;
  background:rgba(0,0,0,0.5);
  padding:10px;
  font-family:Arial;
}
</style>
</head>

<body>

<div id="info">
🎮 WASD — ходить<br>
🖱 Мышка — смотреть<br>
⬅️ ЛКМ — ставить блок<br>
➡️ ПКМ — удалять
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.158/build/three.module.js";

let scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);

let camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
let renderer = new THREE.WebGLRenderer();
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// свет
const light = new THREE.DirectionalLight(0xffffff,1);
light.position.set(5,10,5);
scene.add(light);

// земля
const planeGeo = new THREE.PlaneGeometry(50,50);
const planeMat = new THREE.MeshLambertMaterial({color:0x55aa55});
const plane = new THREE.Mesh(planeGeo, planeMat);
plane.rotation.x = -Math.PI/2;
scene.add(plane);

// блоки
const blocks = [];
const cubeGeo = new THREE.BoxGeometry(1,1,1);
const cubeMat = new THREE.MeshLambertMaterial({color:0x8B4513});

// камера
camera.position.set(0,2,5);

// управление
let keys = {};
document.addEventListener("keydown", e=>keys[e.key]=true);
document.addEventListener("keyup", e=>keys[e.key]=false);

// мышка
document.body.onclick = () => document.body.requestPointerLock();

let yaw = 0;
let pitch = 0;

document.addEventListener("mousemove", e=>{
  if(document.pointerLockElement){
    yaw -= e.movementX * 0.002;
    pitch -= e.movementY * 0.002;
    pitch = Math.max(-1.5, Math.min(1.5, pitch));
  }
});

// луч (для строительства)
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

// клик
document.addEventListener("mousedown", e=>{
  raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
  const intersects = raycaster.intersectObjects([plane,...blocks]);

  if(intersects.length > 0){
    const hit = intersects[0];

    if(e.button === 0){ // поставить
      const cube = new THREE.Mesh(cubeGeo, cubeMat);
      cube.position.copy(hit.point).add(hit.face.normal).floor().addScalar(0.5);
      scene.add(cube);
      blocks.push(cube);
    }

    if(e.button === 2){ // удалить
      if(hit.object !== plane){
        scene.remove(hit.object);
        blocks.splice(blocks.indexOf(hit.object),1);
      }
    }
  }
});

// отключить меню ПКМ
window.addEventListener("contextmenu", e=>e.preventDefault());

// движение
function update(){
  let speed = 0.1;

  let forward = new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw));
  let right = new THREE.Vector3().crossVectors(forward,new THREE.Vector3(0,1,0));

  if(keys["w"]) camera.position.add(forward.clone().multiplyScalar(-speed));
  if(keys["s"]) camera.position.add(forward.clone().multiplyScalar(speed));
  if(keys["a"]) camera.position.add(right.clone().multiplyScalar(-speed));
  if(keys["d"]) camera.position.add(right.clone().multiplyScalar(speed));

  camera.rotation.order = "YXZ";
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;
}

// рендер
function animate(){
  requestAnimationFrame(animate);
  update();
  renderer.render(scene, camera);
}
animate();
</script>

</body>
</html>
